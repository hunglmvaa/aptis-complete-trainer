"heading_en_app":"Our changing perceptions toward mountains.","heading_vi_teacher":"Nhận thức của chúng ta về các ngọn núi đang thay đổi.","memory_token":"changing","mnemonic_chain":"changing → sense → publishing → wrong → revelation → focus → relationship","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Nhận thức của chúng ta về các ngọn núi đang thay đổi.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"For centuries, high mountains were often viewed mainly as dangerous barriers or hostile places to avoid. In modern times, however, they have become symbols of adventure, beauty and personal challenge. Tourism, photography and easier access have changed the way ordinary people think about mountain landscapes. What once inspired fear can now attract people who want to experience nature at its most dramatic.","practice_paragraph_vi":"Trong nhiều thế kỷ, núi cao chủ yếu bị xem là nơi nguy hiểm. Ngày nay, du lịch và khả năng tiếp cận tốt hơn đã làm thay đổi nhận thức: núi trở thành biểu tượng của vẻ đẹp, phiêu lưu và thử thách cá nhân.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T01_H01"},{"id":"R5_T01_H02","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T01","source_no":1,"heading_position":2,"heading_en_teacher":"A sense of achievement","heading_en_app":"A sense of achievement","heading_vi_teacher":"Cảm giác đạt được thành tựu.","memory_token":"sense","mnemonic_chain":"changing → sense → publishing → wrong → revelation → focus → relationship","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Cảm giác đạt được thành tựu.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Reaching a summit can give climbers a powerful feeling of success. The value is not only in standing at the highest point, but also in overcoming tiredness, bad weather and self-doubt on the way. For many people, the climb becomes proof that they can set a difficult goal, keep going when it is uncomfortable, and finally complete what they started.","practice_paragraph_vi":"Việc lên tới đỉnh tạo cảm giác thành tựu vì người leo đã vượt qua mệt mỏi, thời tiết xấu và sự nghi ngờ bản thân để hoàn thành một mục tiêu khó.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T01_H02"},{"id":"R5_T01_H03","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T01","source_no":1,"heading_position":3,"heading_en_teacher":"Publishing one’s achievements","heading_en_app":"Publishing one’s achievements.","heading_vi_teacher":"Công bố những thành tựu của bản thân.","memory_token":"publishing","mnemonic_chain":"changing → sense → publishing → wrong → revelation → focus → relationship","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Công bố những thành tựu của bản thân.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Modern climbers often share their success immediately. A photograph from the summit can appear on social media within minutes, together with a route map, height record or personal message. This public record may inspire friends, but it also changes a private experience into something that can be measured through views and reactions. Achievement is increasingly displayed as well as experienced.","practice_paragraph_vi":"Người leo núi ngày nay thường công bố thành tích qua ảnh, bản đồ hành trình và mạng xã hội, biến trải nghiệm cá nhân thành thành tích được chia sẻ công khai.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T01_H03"},{"id":"R5_T01_H04","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T01","source_no":1,"heading_position":4,"heading_en_teacher":"A wrong priority","heading_en_app":"A wrong priority.","heading_vi_teacher":"Một sự ưu tiên sai lầm.","memory_token":"wrong","mnemonic_chain":"changing → sense → publishing → wrong → revelation → focus → relationship","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một sự ưu tiên sai lầm.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Some climbers become so focused on reaching the top that they ignore more important concerns. They may continue despite worsening weather, exhaustion or warnings from guides simply because turning back feels like failure. In such cases, the summit becomes the wrong priority. Safety, sound judgement and the ability to return home should matter more than completing a planned route at any cost.","practice_paragraph_vi":"Một số người đặt việc chinh phục đỉnh núi lên trên an toàn và phán đoán hợp lý; khi đó mục tiêu lên đỉnh trở thành một ưu tiên sai lầm.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T01_H04"},{"id":"R5_T01_H05","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T01","source_no":1,"heading_position":5,"heading_en_teacher":"A disturbing revelation","heading_en_app":"A disturbing revelation.","heading_vi_teacher":"Một sự thật được tiết lộ gây lo ngại.","memory_token":"revelation","mnemonic_chain":"changing → sense → publishing → wrong → revelation → focus → relationship","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một sự thật được tiết lộ gây lo ngại.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Popular routes have revealed an uncomfortable side of mountain tourism. On some famous peaks, climbers have reported piles of discarded equipment, food packaging and even human waste. The discovery is disturbing because these places are usually imagined as untouched wilderness. The evidence shows that large numbers of visitors can damage even remote environments when waste and responsibility are poorly managed.","practice_paragraph_vi":"Các tuyến leo núi nổi tiếng đã để lộ lượng rác và chất thải đáng lo ngại, cho thấy ngay cả môi trường xa xôi cũng bị tác động bởi lượng khách lớn.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T01_H05"},{"id":"R5_T01_H06","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T01","source_no":1,"heading_position":6,"heading_en_teacher":"A new focus on sustainability","heading_en_app":"A new focus on sustainability.","heading_vi_teacher":"Một trọng tâm mới về tính bền vững.","memory_token":"focus","mnemonic_chain":"changing → sense → publishing → wrong → revelation → focus → relationship","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một trọng tâm mới về tính bền vững.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"A growing number of organisations now judge expeditions not only by whether they reach the summit but also by how responsibly they operate. Teams are encouraged to reduce waste, carry rubbish back, use local services fairly and limit damage to fragile paths. This reflects a new focus: success should include protecting the mountain so that future visitors can enjoy the same environment.","practice_paragraph_vi":"Các tổ chức ngày càng coi tính bền vững là một phần của thành công: giảm rác, mang rác xuống, hỗ trợ địa phương và hạn chế làm hỏng đường mòn.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T01_H06"},{"id":"R5_T01_H07","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T01","source_no":1,"heading_position":7,"heading_en_teacher":"A more intimate relationship","heading_en_app":"A more intimate relationship.","heading_vi_teacher":"Một mối quan hệ gần gũi hơn.","memory_token":"relationship","mnemonic_chain":"changing → sense → publishing → wrong → revelation → focus → relationship","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một mối quan hệ gần gũi hơn.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Not everyone wants to conquer a mountain as quickly as possible. Some walkers return to the same landscape many times, learning its seasons, weather patterns, plants and local stories. Their connection becomes more personal than a single summit photograph. By slowing down and paying attention, they develop a more intimate relationship with the place rather than treating it only as a challenge to be completed.","practice_paragraph_vi":"Một số người quay lại cùng một vùng núi nhiều lần, hiểu mùa, thời tiết và câu chuyện địa phương, từ đó tạo mối quan hệ gần gũi hơn thay vì chỉ coi núi là thử thách.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T01_H07"},{"id":"R5_T02_H01","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T02","source_no":2,"heading_position":1,"heading_en_teacher":"A way of life now out dated","heading_en_app":"A way of life now out dated","heading_vi_teacher":"Một lối sống nay đã lỗi thời.","memory_token":"life","mnemonic_chain":"life → benefits → financial → challenges → old → people → solutions","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một lối sống nay đã lỗi thời.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"The five-day office week became normal in an era when work was organised around fixed workplaces and fixed hours. Digital tools, remote access and changing expectations have made that pattern less automatic. Many employees can now complete tasks from different locations and at different times. As a result, organisations are questioning whether a schedule designed for an earlier industrial lifestyle still fits modern knowledge work.","practice_paragraph_vi":"Tuần làm việc năm ngày hình thành trong bối cảnh cũ; công nghệ số và cách làm việc linh hoạt khiến mô hình này ngày càng bị xem là lỗi thời.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T02_H01"},{"id":"R5_T02_H02","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T02","source_no":2,"heading_position":2,"heading_en_teacher":"Benefits for Employees","heading_en_app":"Benefits for Employees","heading_vi_teacher":"Lợi ích dành cho người lao động.","memory_token":"benefits","mnemonic_chain":"life → benefits → financial → challenges → old → people → solutions","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Lợi ích dành cho người lao động.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Supporters of a four-day week argue that employees can gain more time for family, rest and personal interests without losing their full salary. Extra recovery time may reduce stress and improve concentration when people return to work. Some trials have also reported lower absence rates and better job satisfaction, suggesting that shorter schedules can improve employees' quality of life as well as workplace motivation.","practice_paragraph_vi":"Người lao động có thêm thời gian nghỉ, gia đình và sở thích; điều này có thể giảm căng thẳng, tăng tập trung và mức độ hài lòng với công việc.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T02_H02"},{"id":"R5_T02_H03","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T02","source_no":2,"heading_position":3,"heading_en_teacher":"Undesirable financial consequences","heading_en_app":"Undesirable financial consequences","heading_vi_teacher":"Những hậu quả tài chính không mong muốn.","memory_token":"financial","mnemonic_chain":"life → benefits → financial → challenges → old → people → solutions","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Những hậu quả tài chính không mong muốn.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Reducing working days does not automatically reduce costs. A business that must remain open every day may need additional staff to cover the missing hours. Customer service, healthcare and manufacturing can be especially difficult to reorganise. If productivity does not rise enough, the company may face higher labour costs or lower output, creating financial consequences that were not part of the original plan.","practice_paragraph_vi":"Tuần bốn ngày có thể làm tăng chi phí nhân sự hoặc giảm sản lượng ở các ngành phải vận hành liên tục nếu năng suất không tăng đủ.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T02_H03"},{"id":"R5_T02_H04","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T02","source_no":2,"heading_position":4,"heading_en_teacher":"Unforeseen Challenges for Employees","heading_en_app":"Unforeseen Challenges for Employees","heading_vi_teacher":"Những thách thức không lường trước đối với người lao động.","memory_token":"challenges","mnemonic_chain":"life → benefits → financial → challenges → old → people → solutions","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Những thách thức không lường trước đối với người lao động.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"An extra free day sounds attractive, but the change can create new pressures. Employees may be expected to complete five days of tasks in four longer or more intense days. Meetings can be compressed and deadlines may feel closer together. Some workers find that the shorter week improves their life, while others feel more exhausted because the same workload has simply been concentrated into less time.","practice_paragraph_vi":"Lịch ngắn hơn có thể khiến khối lượng công việc năm ngày bị nén vào bốn ngày, làm tăng cường độ, áp lực họp và hạn chót.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T02_H04"},{"id":"R5_T02_H05","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T02","source_no":2,"heading_position":5,"heading_en_teacher":"Difficult to change old habits","heading_en_app":"Difficulty to change old habits","heading_vi_teacher":"Khó thay đổi những thói quen cũ.","memory_token":"old","mnemonic_chain":"life → benefits → financial → challenges → old → people → solutions","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Khó thay đổi những thói quen cũ.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"DIFFERENT_SOURCE_WORDING","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":["Teacher: Difficult to change old habits | App: Difficulty to change old habits"],"practice_paragraph_en":"Even when a company officially introduces a shorter week, old routines can be hard to remove. Managers may continue scheduling Friday messages, workers may check email on their day off, and clients may still expect immediate replies. The policy changes on paper before behaviour changes in practice. Without clear boundaries, people can end up working informally on the supposedly free day.","practice_paragraph_vi":"Thói quen cũ rất khó thay đổi: quản lý, nhân viên và khách hàng vẫn có thể tiếp tục liên lạc vào ngày nghỉ, khiến chính sách không thực sự được áp dụng.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T02_H05"},{"id":"R5_T02_H06","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T02","source_no":2,"heading_position":6,"heading_en_teacher":"An unfair plan for some people","heading_en_app":"An unfair plan for some people","heading_vi_teacher":"Một kế hoạch không công bằng đối với một số người.","memory_token":"people","mnemonic_chain":"life → benefits → financial → challenges → old → people → solutions","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một kế hoạch không công bằng đối với một số người.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"A four-day week may benefit office staff while leaving other workers with fewer choices. People in hospitals, shops, transport or hospitality cannot always stop services for an extra day. Part-time workers may also receive little benefit if their hours are already limited. A plan presented as universally progressive can therefore appear unfair when only certain occupations are able to take advantage of it.","practice_paragraph_vi":"Chính sách có thể thiếu công bằng vì nhân viên văn phòng dễ hưởng lợi hơn những người làm y tế, bán lẻ, vận tải, dịch vụ hoặc lao động bán thời gian.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T02_H06"},{"id":"R5_T02_H07","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T02","source_no":2,"heading_position":7,"heading_en_teacher":"Alternative solutions worth considering","heading_en_app":"Alternative solutions worth considering","heading_vi_teacher":"Những giải pháp thay thế đáng để cân nhắc.","memory_token":"solutions","mnemonic_chain":"life → benefits → financial → challenges → old → people → solutions","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Những giải pháp thay thế đáng để cân nhắc.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Instead of applying the same four-day schedule everywhere, organisations can consider other forms of flexibility. Options include shorter daily hours, remote work, staggered shifts, compressed hours chosen by employees, or extra annual leave. The best solution may depend on the type of work and customer needs. Flexibility can therefore be designed in several ways rather than treated as a single fixed model.","practice_paragraph_vi":"Ngoài tuần bốn ngày, doanh nghiệp có thể cân nhắc giờ làm ngắn hơn, làm từ xa, ca lệch, nén giờ tự chọn hoặc tăng ngày phép.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T02_H07"},{"id":"R5_T03_H01","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T03","source_no":3,"heading_position":1,"heading_en_teacher":"Gender obscure achievements","heading_en_app":"Gender obscure achievements","heading_vi_teacher":"Định kiến giới đã che khuất những thành tựu.","memory_token":"obscure","mnemonic_chain":"obscure → pioneer → man → long → people → balance → uniformity","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Định kiến giới đã che khuất những thành tựu.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"For a long time, histories of mathematics focused mainly on male scholars, which made important work by women less visible. Social expectations also limited women's access to universities, professional societies and publication. When later generations read only the most famous names, they can wrongly assume that women contributed little. Gender therefore shaped not only opportunities but also which achievements were remembered.","practice_paragraph_vi":"Lịch sử toán học thường tập trung vào nam giới, trong khi định kiến và hạn chế xã hội khiến thành tựu của phụ nữ ít được nhìn thấy và ghi nhớ.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T03_H01"},{"id":"R5_T03_H02","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T03","source_no":3,"heading_position":2,"heading_en_teacher":"Acknowledging achievement of pioneering woman","heading_en_app":"Acknowledging achievements of pioneering women","heading_vi_teacher":"Ghi nhận thành tựu của một nữ tiên phong.","memory_token":"pioneer","mnemonic_chain":"obscure → pioneer → man → long → people → balance → uniformity","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Ghi nhận thành tựu của một nữ tiên phong.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"DIFFERENT_SOURCE_WORDING","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":["Teacher: Acknowledging achievement of pioneering woman | App: Acknowledging achievements of pioneering women"],"practice_paragraph_en":"One way to correct an incomplete history is to identify pioneering women and explain exactly what they achieved. Recognition should go beyond mentioning a name. It should describe the mathematical problem, the method developed and the influence on later work. By acknowledging a pioneer in this way, historians can restore a contribution that may previously have been treated as secondary or ignored.","practice_paragraph_vi":"Cần ghi nhận đầy đủ các nữ tiên phong bằng cách nêu rõ bài toán, phương pháp và ảnh hưởng của họ, thay vì chỉ nhắc tên một cách tượng trưng.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T03_H02"},{"id":"R5_T03_H03","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T03","source_no":3,"heading_position":3,"heading_en_teacher":"Man unfairly credited","heading_en_app":"Man unfairly credited","heading_vi_teacher":"Một người đàn ông được ghi nhận công lao một cách không công bằng.","memory_token":"man","mnemonic_chain":"obscure → pioneer → man → long → people → balance → uniformity","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một người đàn ông được ghi nhận công lao một cách không công bằng.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"In some historical cases, a woman's mathematical contribution appeared under a male colleague's name or was credited mainly to a husband, supervisor or senior researcher. This could happen because institutions did not accept women formally or because publishers trusted male names more. Later research into letters, drafts and records has sometimes shown that the original credit did not fairly represent who did the work.","practice_paragraph_vi":"Một số công trình của phụ nữ từng bị ghi công cho đồng nghiệp nam, chồng hoặc cấp trên do rào cản thể chế và định kiến xuất bản.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T03_H03"},{"id":"R5_T03_H04","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T03","source_no":3,"heading_position":4,"heading_en_teacher":"A long career showing exceptional ability","heading_en_app":"A long career showing exceptional ability","heading_vi_teacher":"Một sự nghiệp lâu dài thể hiện năng lực xuất sắc.","memory_token":"long","mnemonic_chain":"obscure → pioneer → man → long → people → balance → uniformity","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Một sự nghiệp lâu dài thể hiện năng lực xuất sắc.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"Exceptional ability is not always shown by one dramatic discovery. Some mathematicians demonstrated it across decades of teaching, research and problem solving. Their influence came from sustained work: publishing papers, supporting students, developing methods and contributing to several areas over a long career. Looking at the whole career can reveal a level of achievement that a short list of famous results may miss.","practice_paragraph_vi":"Năng lực xuất sắc có thể được thể hiện qua một sự nghiệp dài với nghiên cứu, giảng dạy, công bố và đóng góp bền bỉ chứ không chỉ một phát hiện nổi tiếng.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T03_H04"},{"id":"R5_T03_H05","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T03","source_no":3,"heading_position":5,"heading_en_teacher":"Labels can change perspective on people","heading_en_app":"Labels can change perspective on people","heading_vi_teacher":"Những nhãn gán có thể thay đổi cách nhìn về con người.","memory_token":"people","mnemonic_chain":"obscure → pioneer → man → long → people → balance → uniformity","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Những nhãn gán có thể thay đổi cách nhìn về con người.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"The labels attached to a person can strongly affect how others interpret the same evidence. Calling someone an 'assistant' rather than a 'researcher', for example, may cause readers to underestimate independent intellectual work. When historians revise such labels, the person's role can look very different. Language does not change the past, but it can change the perspective through which achievements are understood.","practice_paragraph_vi":"Nhãn gán như 'trợ lý' thay vì 'nhà nghiên cứu' có thể khiến người đọc đánh giá thấp vai trò thật; thay đổi cách gọi có thể thay đổi góc nhìn về thành tựu.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T03_H05"},{"id":"R5_T03_H06","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T03","source_no":3,"heading_position":6,"heading_en_teacher":"Attempting to create a gender balance","heading_en_app":"Altempting to create a gender balance","heading_vi_teacher":"Nỗ lực tạo ra sự cân bằng giới.","memory_token":"balance","mnemonic_chain":"obscure → pioneer → man → long → people → balance → uniformity","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Nỗ lực tạo ra sự cân bằng giới.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"DIFFERENT_SOURCE_WORDING","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":["Teacher: Attempting to create a gender balance | App: Altempting to create a gender balance"],"practice_paragraph_en":"Universities and professional organisations have tried several methods to improve gender balance in mathematics. These include scholarships, mentoring, targeted recruitment, conference support and efforts to make selection processes more transparent. The goal is not simply to increase a number on a report, but to reduce barriers that can prevent capable people from entering, remaining in or progressing through the field.","practice_paragraph_vi":"Các tổ chức dùng học bổng, cố vấn, tuyển dụng mục tiêu và quy trình minh bạch hơn để giảm rào cản và cải thiện cân bằng giới trong toán học.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T03_H06"},{"id":"R5_T03_H07","skill":"reading","part":5,"source_type":"teacher_forecast_plus_public_app","topic_id":"R5_T03","source_no":3,"heading_position":7,"heading_en_teacher":"Uniformity is not always beneficial","heading_en_app":"Uniformity is not always beneficial","heading_vi_teacher":"Sự đồng nhất không phải lúc nào cũng mang lại lợi ích.","memory_token":"uniformity","mnemonic_chain":"obscure → pioneer → man → long → people → balance → uniformity","paragraph_en":null,"paragraph_vi":null,"evidence":null,"hint_vi":"Sự đồng nhất không phải lúc nào cũng mang lại lợi ích.","verification":{"teacher_heading":"TRANSCRIBED_FROM_TEACHER_SCAN","teacher_vi":"VERIFIED_FROM_TEACHER_WORD_TABLE","app_heading":"VERIFIED_FROM_PUBLIC_APP_SOURCE","teacher_vs_app_heading":"MATCH","memory_token":"VERIFIED_FROM_TEACHER_HOC_MEO","paragraph":"NOT_PRESENT_IN_SOURCE"},"content_status":"VERIFIED_HEADING_SEQUENCE_CORE","forecast_readiness":"HEADING_SEQUENCE_QUIZ_READY","full_exam_readiness":"SOURCE_INCOMPLETE_PARAGRAPHS","qa_notes":[],"practice_paragraph_en":"A department in which everyone has a very similar background may find agreement easy, but agreement is not always the same as strong thinking. Different experiences can lead people to ask different questions, notice different assumptions and challenge familiar methods. Diversity does not guarantee better results in every case, yet complete uniformity can limit the range of perspectives available when difficult problems are being solved.","practice_paragraph_vi":"Một tập thể quá đồng nhất có thể thiếu góc nhìn đa dạng; khác biệt về kinh nghiệm giúp đặt câu hỏi khác, phát hiện giả định và mở rộng cách giải quyết vấn đề.","practice_provenance":"GENERATED_PRACTICE","practice_answer_heading_id":"R5_T03_H07"}],"source_differences":["R5_T02_H05: Teacher: Difficult to change old habits | App: Difficulty to change old habits","R5_T03_H02: Teacher: Acknowledging achievement of pioneering woman | App: Acknowledging achievements of pioneering women","R5_T03_H06: Teacher: Attempting to create a gender balance | App: Altempting to create a gender balance"],"validation":{"topic_count_expected":3,"topic_count_actual":3,"heading_count_expected":21,"heading_count_actual":21,"duplicate_ids":[],"paragraph_count_source":0,"teacher_app_title_differences":["R5_T01","R5_T02"],"teacher_app_heading_differences":["R5_T02_H05","R5_T03_H02","R5_T03_H06"],"heading_sequence_bank_passed":true,"full_exam_ready":false}}}};
</script><script>window.BUNDLED_ONLINE_PACKS=[{"schema_version":"3.2","pack_id":"LISTENING_PACK_03_04_V3_2","title":"APTIS Listening Pack 03–04 · Canonical V1.2","canonical_source":"APTIS_DATA_CANONICAL_V1_2","voice_engine":"Web Speech API","notes":{"scope":"Two additional listening sets for APTIS Complete Trainer V3.2","l1_policy":"24 verified MCQ items per set. Q075 and Q081 omitted because their source question OCR is visibly corrupted; source raw strings remain preserved for included items.","display_cleaning":"Only obvious OCR/display artifacts are cleaned. Answer indices and source concepts are unchanged.","provenance":"L1 scripts, L3 dialogues, L4 monologues and L2 extra distractors are GENERATED_PRACTICE; source questions/answers/transcripts remain marked SOURCE."},"sets":[{"set_id":"SET_03","title":"Listening Set 03 · Study, Arts & School Sport","parts":{"L1":[{"id":"L1_Q051","source_ref":"L1_Q051","source_question_raw":"Why is he learning to drive?","source_options_raw":["driving a car is his dream","he hates public transport","he has to drive to work"],"question_en":"Why is he learning to drive?","options":["driving a car is his dream","he hates public transport","he has to drive to work"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"I've written down he has to drive to work. Is that still correct?"},{"speaker":"F","text":"Yes. We talked about he hates public transport first, and someone suggested driving a car is his dream, but neither became the final choice."},{"speaker":"M","text":"Perfect, I'll keep he has to drive to work then."}],"key_vi":{"type":"LÝ DO / MỤC ĐÍCH / NGUYÊN NHÂN / LỜI KHUYÊN","answer":"he has to drive to work","hint":"Anh ay học lái xe để làm gì?","explanation":"Key cần nhớ: he has to drive to work. Hai lựa chọn “driving a car is his dream” và “he hates public transport” là phương và “Math” là phương án nhiễu; chỉ chốt khi nghe ý cuối cùng được xác nhận.","evidence_en":"There were a few possibilities: Math, Science, and Art."}},{"id":"L1_Q074","source_ref":"L1_Q074","source_question_raw":"What does she usually do in her free time?","source_options_raw":["Go to the theatre and play sports","Play sports and go shopping","Stay at home and shop online"],"question_en":"What does she usually do in her free time?","options":["Go to the theatre and play sports","Play sports and go shopping","Stay at home and shop online"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Let's check the detail once more. It isn't Stay at home and shop online."},{"speaker":"F","text":"And not Play sports and go shopping either. The speaker settles on Go to the theatre and play sports."},{"speaker":"M","text":"Okay, Go to the theatre and play sports. I'll use that."}],"key_vi":{"type":"HOẠT ĐỘNG / THÓI QUEN / KẾ HOẠCH","answer":"Go to the theatre and play sports","hint":"Cô ấy thường làm gì vào thời gian rảnh?","explanation":"Key cần nhớ: Go to the theatre and play sports. Hai lựa chọn “Play sports and go shopping” và “Stay at home and shop online” là phương án nhiễu; chỉ chốt khi nghe ý cuối cùng được xác nhận.","evidence_en":"And not Play sports and go shopping either. The speaker settles on Go to the theatre and play sports."}}],"L2":{"topic_id":"L2_T03","title":"PREFER TO STUDY","title_vi":"THÍCH HỌC Ở ĐÂU HƠN","provenance":{"transcripts":"SOURCE","answers":"SOURCE","extra_distractors":"GENERATED_PRACTICE"},"options":["At various places","In a quiet place","With music","Late at night","Only in a crowded classroom","Only early in the morning"],"speakers":[{"id":"L2_T03_SA","speaker":"A","script_text":"\"I've realized that my study environment has a significant impact on my productivity. Changing my study space has really helped me focus better. The library offers a quiet atmosphere that's perfect for serious work, but sometimes, a lively cafe is just what I need for a refreshing change. Being outdoors in a park with fresh air can also clear my mind. Each place keeps my study sessions interesting and engaging.\"","answer":"At various places","key_vi":{"answer":"Ở nhiều địa điểm khác nhau","explanation":"Đáp án nguồn là “At various places”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker A.","evidence_en":"Changing my · study space · The library · a lively cafe · outdoors in a park · Each place"}},{"id":"L2_T03_SB","speaker":"B","script_text":"\"Finding the right space to study is crucial for effective learning. I usually end up in a quiet room at home or a secluded corner in the library. It's incredible how much I can absorb without distractions. This kind of environment really allows me to think deeply and connect with the material I'm learning.\"","answer":"In a quiet place","key_vi":{"answer":"Ở một nơi yên tĩnh","explanation":"Đáp án nguồn là “In a quiet place”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker B.","evidence_en":"quiet room · home · secluded corner"}},{"id":"L2_T03_SC","speaker":"C","script_text":"\"I've discovered that the right soundtrack can enhance my study sessions significantly. When I study, having some background music makes a noticeable difference. I tend to choose soft melodies or instrumental tracks that won't distract me. The right music helps maintain my energy and makes long study sessions feel less tedious. It creates a motivating atmosphere that encourages me to keep pushing through.\"","answer":"With music","key_vi":{"answer":"Khi nghe nhạc","explanation":"Đáp án nguồn là “With music”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker C.","evidence_en":"background music · The right music"}},{"id":"L2_T03_SD","speaker":"D","script_text":"\"Surprisingly, I find that late-night hours work best for my studying. The quietness of the night really helps me concentrate. While others are winding down, I feel more alert and inspired. Those late hours give me a chance to dive deep into my work without interruptions, turning them into my most productive study sessions.\"","answer":"Late at night","key_vi":{"answer":"Vào ban đêm / khuya","explanation":"Đáp án nguồn là “Late at night”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker D.","evidence_en":"late-night hours · Those late hours give"}}]},"L3":{"topic_id":"L3_T03","title":"Arts","title_vi":"Nghệ thuật","provenance":{"statements":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_segments":[{"speaker":"M","text":"We've both been thinking about arts, and I suspect we won't agree on every detail."},{"speaker":"F","text":"Probably not. It helps to separate the individual claims, because our opinions can change from one point to the next."},{"speaker":"M","text":"For me, arts are only for few privileged. I've seen enough examples to feel quite strongly about that."},{"speaker":"F","text":"I see the point, but I wouldn't go that far. I think there are too many exceptions for me to agree completely."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I take a clearer position: the government ought to invest increasingly in arts. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'd say children ought to be exposed to art early. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I take a clearer position: in the future, art is likely to be increasingly accessible. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"What makes this kind of discussion difficult is that sharing the same topic doesn't mean sharing the same judgement."},{"speaker":"F","text":"Exactly. A listener has to track who actually supports each idea, and whether the other speaker agrees, qualifies it, or rejects it."},{"speaker":"M","text":"Another thing I notice in discussions like this is that the same vocabulary can support different opinions. One person may mention the same problem as the other but use it to reach a different conclusion. That is why listening only for repeated nouns is risky; the important information is often in the verb, the evaluation, or the contrast that follows."},{"speaker":"F","text":"Yes, and agreement is not always expressed with the word 'agree'. Sometimes a speaker restates the idea positively, gives a supporting example, or says that something matches their own experience. Disagreement can also be indirect: a speaker may say 'perhaps', 'not always', or 'it depends', which weakens the claim rather than rejecting every part of it."},{"speaker":"M","text":"So during practice I would keep the four statements visible and make a quick mark only after each opinion becomes clear. If a speaker changes direction, the later qualified position should matter more than the first reaction."},{"speaker":"F","text":"And after the audio ends, it is worth checking the pattern across all four statements. The aim is not to force a remembered code onto the conversation, but to use the code only as a memory check after the evidence has been heard."}],"statements":[{"id":"L3_T03_Q01","no":1,"text":"Arts are only for few privileged","answer":"M","key_vi":{"statement_vi":"Nghệ thuật chỉ dành cho một số ít người có đặc quyền","answer_text":"Man","code_digit":"1"}},{"id":"L3_T03_Q02","no":2,"text":"The government should invest more in arts","answer":"W","key_vi":{"statement_vi":"Chính phủ nên đầu tư nhiều hơn vào nghệ thuật","answer_text":"Woman","code_digit":"2"}},{"id":"L3_T03_Q03","no":3,"text":"Children should be exposed to art early","answer":"B","key_vi":{"statement_vi":"Trẻ em nên được tiếp xúc với nghệ thuật từ sớm","answer_text":"Both","code_digit":"0"}},{"id":"L3_T03_Q04","no":4,"text":"In the future, art will be more accessible","answer":"W","key_vi":{"statement_vi":"Trong tương lai, nghệ thuật sẽ dễ tiếp cận hơn","answer_text":"Woman","code_digit":"2"}}],"canonical_code":"1202"},"L4":{"topic_id":"L4_T03","title":"SPORT COMPETITION IN SCHOOL","title_vi":"Cuộc thi thể thao ở trường","provenance":{"questions":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_text":"People often have quick opinions about sport competition in school, but my experience has been more complicated. At first I expected the most obvious explanation to be right, and I even considered the idea that they usually have positive effects on students. Another possibility people often mention is that they help students avoid physical risks. After looking at the situation more carefully, neither description really matched what happened. The better summary is that things were negative effects. That difference matters because the speaker's final judgement is more qualified than the tempting alternatives. There is another aspect that is easy to miss. Some people argue that it makes students' lives more unbalanced, while others go almost to the opposite extreme and say that it leaves little time for other activities. My own view sits elsewhere. What matters is creates balance. In other words, the conclusion depends on the exact conditions being discussed, not on a broad slogan. During the discussion I might use several words related to the wrong choices, because they are realistic possibilities. That does not make them the answer. The key is to notice when an idea is introduced only to be limited, corrected, or rejected. Expressions such as “however”, “in practice”, “actually”, and “what matters more” often signal that the speaker is moving toward the real position. For a listening task, I would therefore avoid selecting an option as soon as I hear familiar vocabulary. I would wait until the evaluation becomes clear, then match that meaning to the option that paraphrases it most accurately. The two ideas to retain from this talk are the ones expressed through negative effects, damaging and creates balance, student life; they represent the settled view rather than the rejected alternatives. A longer talk also includes background that may not directly answer either question. For example, a speaker may describe how the issue developed, mention another person's view, or give a small personal example before returning to the main judgement. Those details are useful context, but they should not replace the two target conclusions. When I practise, I try to separate background information from evaluation language. Background tells me what happened; evaluation tells me what the speaker finally thinks about it. I also listen for changes in certainty. Words such as 'probably', 'only', 'not always', 'unlikely', and 'depends' can completely change which option is accurate. If two answers share similar vocabulary, the safer choice is the one that matches the strength and direction of the speaker's final judgement.","questions":[{"id":"L4_T03_Q01","no":1,"options":["They can cause harmful effects","They usually have positive effects on students.","They help students avoid physical risks."],"answer_index":0,"key_vi":{"answer":"Chúng có thể gây ra những tác động có hại","explanation":"Chọn phương án khớp với kết luận cuối cùng của người nói. Các lựa chọn còn lại có thể được nhắc đến trong bài nhưng bị giới hạn, sửa lại hoặc bác bỏ.","evidence_en":"negative effects"}},{"id":"L4_T03_Q02","no":2,"options":["It helps balance students' lives","It makes students' lives more unbalanced.","It leaves little time for other activities."],"answer_index":0,"key_vi":{"answer":"Nó giúp cân bằng cuộc sống của học sinh","explanation":"Chọn phương án khớp với kết luận cuối cùng của người nói. Các lựa chọn còn lại có thể được nhắc đến trong bài nhưng bị giới hạn, sửa lại hoặc bác bỏ.","evidence_en":"creates balance"}}]}}},{"set_id":"SET_04","title":"Listening Set 04 · Music, Auditions & TV Series","parts":{"L1":[{"id":"L1_Q076","source_ref":"L1_Q076","source_question_raw":"What is his opinion on train travel?","source_options_raw":["Convenient","Friendly","Practical"],"question_en":"What is his opinion on train travel?","options":["Convenient","Friendly","Practical"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"I nearly chose Friendly."},{"speaker":"F","text":"I can see why, because it came up in the conversation. But after the correction, the answer is Practical."},{"speaker":"M","text":"So Convenient and Friendly are both distractors, and Practical is the detail I need."}],"key_vi":{"type":"SỞ THÍCH / CẢM XÚC / Ý KIẾN / THỜI TIẾT","answer":"Practical","hint":"Quan điểm của anh ấy về di tau?","explanation":"Key cần nhớ: Practical. Hai lựa chọn “Convenient” và “Friendly” là phương án nhiễu; chỉ chốt khi nghe ý cuối cùng được xác nhận.","evidence_en":"I can see why, because it came up in the conversation. But after the correction, the answer is Practical."}},{"id":"L1_Q077","source_ref":"L1_Q077","source_question_raw":"What is not original?","source_options_raw":["Furniture","Door","Window"],"question_en":"What is not original?","options":["Furniture","Door","Window"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"I nearly chose Door."} tions":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Was the answer The boy's team, or am I remembering that wrongly?"},{"speaker":"F","text":"Wrongly. The boy's team was only an earlier possibility. It's actually The girl's team."},{"speaker":"M","text":"Good. I also heard Anna, Sara and the girl's team, but that was about something else."}],"key_vi":{"type":"AI / NGƯỜI NÀO / SỐNG VỚI AI / CHỤP AI","answer":"The girl's team","hint":"cô ấy đang chụp ảnh ai?","explanation":"Key cần nhớ: The girl's team. Hai lựa chọn “The boy's team” và “Anna, Sara and the girl's team” là phương án nhiễu; chỉ chốt khi nghe ý cuối cùng được xác nhận.","evidence_en":"Wrongly. The boy's team was only an earlier possibility. It's actually The girl's team."}}],"L2":{"topic_id":"L2_T04","title":"LISTENING TO MUSIC","title_vi":"NGHE NHẠC","provenance":{"transcripts":"SOURCE","answers":"SOURCE","extra_distractors":"GENERATED_PRACTICE"},"options":["After waking up","While studying","While singing","To relax","Only during exercise","Only when travelling to work"],"speakers":[{"id":"L2_T04_SA","speaker":"A","script_text":"\"I like to start my day with music as soon as I wake up. It helps me feel energized and ready for whatever lies ahead. As soon as I get out of bed, I turn on my favorite playlist, which is usually full of upbeat, happy songs. It's like my morning ritual, setting the mood for the day and getting me in a good headspace. Music really helps kick-start my mornings on a positive note.\"","answer":"After waking up","key_vi":{"answer":"Sau khi thức dậy","explanation":"Đáp án nguồn là “After waking up”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker A.","evidence_en":"start my day · as soon as I wake up · get out of bed · my morning ritual · my mornings"}},{"id":"L2_T04_SB","speaker":"B","script_text":"\"For me, music is a must when I'm studying. I know some people find it distracting but I actually concentrate better when there's music playing in the background. I usually pick something without lyrics like instrumental or electronic music. So it doesn't interrupt my thinking. It keeps me focused and helps me stay motivated when I'm working on long assignments or preparing for exams. It's become part of my study routine now.\"","answer":"While studying","key_vi":{"answer":"Trong khi học","explanation":"Đáp án nguồn là “While studying”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker B.","evidence_en":"music · when I'm studying · there's music playing in the background"}},{"id":"L2_T04_SC","speaker":"C","script_text":"\"I've always loved singing. So, I listen to music whenever I feel like practicing my vocals. It's not just about listening for fun. I like to sing along and try to improve my voice. Whether it's pop songs or karaoke tracks, I find it really enjoyable and a great way to express myself. Sometimes, I even record myself to see how I'm doing. It's a fun hobby, and I love exploring new songs and melodies.\"","answer":"While singing","key_vi":{"answer":"Trong khi hát","explanation":"Đáp án nguồn là “While singing”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker C.","evidence_en":"singing · listen to music · practicing my vocals · like to sing along · my voice · karaoke · new songs"}},{"id":"L2_T04_SD","speaker":"D","script_text":"\"I've always found music to be the best way to unwind after a long day. I like to listen to music when I want to relax. It helps me switch off from everything, whether I'm lying on the couch or taking a walk in the park. I usually go for something soft and calming like acoustic or classical music. It's my way of de-stressing and escaping from all the noise of everyday life. I just closed my eyes and the music took me away.\"","answer":"To relax","key_vi":{"answer":"Để thư giãn","explanation":"Đáp án nguồn là “To relax”. Không chờ nghe đúng nguyên văn đáp án; hãy nhận ra paraphrase và ý chính của Speaker D.","evidence_en":"found music · unwind · I want to relax · de-stressing · noise of everyday life · my eyes and the music took me away"}}]},"L3":{"topic_id":"L3_T04","title":"Auditions","title_vi":"Các buổi thử giọng","provenance":{"statements":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_segments":[{"speaker":"M","text":"We've both been thinking about auditions, and I suspect we won't agree on every detail."},{"speaker":"F","text":"Probably not. It helps to separate the individual claims, because our opinions can change from one point to the next."},{"speaker":"M","text":"For me, auditions are most important. I've seen enough examples to feel quite strongly about that."},{"speaker":"F","text":"I see the point, but I wouldn't go that far. I think there are too many exceptions for me to agree completely."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I take a clearer position: actors response best to strong scripts. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'd say theater acting and screen acting are different. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"I'd say actors ought to be praised as much as possible. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"What makes this kind of discussion difficult is that sharing the same topic doesn't mean sharing the same judgement."},{"speaker":"F","text":"Exactly. A listener has to track who actually supports each idea, and whether the other speaker agrees, qualifies it, or rejects it."},{"speaker":"M","text":"Another thing I notice in discussions like this is that the same vocabulary can support different opinions. One person may mention the same problem as the other but use it to reach a different conclusion. That is why listening only for repeated nouns is risky; the important information is often in the verb, the evaluation, or the contrast that follows."},{"speaker":"F","text":"Yes, and agreement is not always expressed with the word 'agree'. Sometimes a speaker restates the idea positively, gives a supporting example, or says that something matches their own experience. Disagreement can also be indirect: a speaker may say 'perhaps', 'not always', or 'it depends', which weakens the claim rather than rejecting every part of it."},{"speaker":"M","text":"So during practice I would keep the four statements visible and make a quick mark only after each opinion becomes clear. If a speaker changes direction, the later qualified position should matter more than the first reaction."},{"speaker":"F","text":"And after the audio ends, it is worth checking the pattern across all four statements. The aim is not to force a remembered code onto the conversation, but to use the code only as a memory check after the evidence has been heard."}],"statements":[{"id":"L3_T04_Q01","no":1,"text":"Auditions are most important","answer":"M","key_vi":{"statement_vi":"Các buổi thử giọng là quan trọng nhất","answer_text":"Man","code_digit":"1"}},{"id":"L3_T04_Q02","no":2,"text":"Actors response best to strong scripts","answer":"W","key_vi":{"statement_vi":"Diễn viên phản ứng tốt nhất với những kịch bản có nội dung chất lượng","answer_text":"Woman","code_digit":"2"}},{"id":"L3_T04_Q03","no":3,"text":"Theater acting and screen acting are different","answer":"B","key_vi":{"statement_vi":"Diễn xuất trên sân khấu và diễn xuất trên màn ảnh là khác nhau","answer_text":"Both","code_digit":"0"}},{"id":"L3_T04_Q04","no":4,"text":"Actors should be praised as much as possible","answer":"B","key_vi":{"statement_vi":"Diễn viên nên được khen ngợi càng nhiều càng tốt","answer_text":"Both","code_digit":"0"}}],"canonical_code":"1200"},"L4":{"topic_id":"L4_T04","title":"TELEVISION SERIES","title_vi":"Phim truyền hình dài tập","provenance":{"questions":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_text":"People often have quick opinions about television series, but my experience has been more complicated. At first I expected the most obvious explanation to be right, and I even considered the idea that its quality changes considerably from one episode to another. Another possibility people often mention is that some episodes are much weaker than the others. After looking at the situation more carefully, neither description really matched what happened. The better summary is that things were steady. That difference matters because the speaker's final judgement is more qualified than the tempting alternatives. There is another aspect that is easy to miss. Some people argue that the series is made without considering its audience, while others go almost to the opposite extreme and say that viewer preferences have little effect on production decisions. My own view sits elsewhere. What matters is audience. In other words, the conclusion depends on the exact conditions being discussed, not on a broad slogan. During the discussion I might use several words related to the wrong choices, because they are realistic possibilities. That does not make them the answer. The key is to notice when an idea is introduced only to be limited, corrected, or rejected. Expressions such as “however”, “in practice”, “actually”, and “what matters more” often signal that the speaker is moving toward the real position. For a listening task, I would therefore avoid selecting an option as soon as I hear familiar vocabulary. I would wait until the evaluation becomes clear, then match that meaning to the option that paraphrases it most accurately. The two ideas to retain from this talk are the ones expressed through steady, standard and audience, viewing habits; they represent the settled view rather than the rejected alternatives. A longer talk also includes background that may not directly answer either question. For example, a speaker may describe how the issue developed, mention another person's view, or give a small personal example before returning to the main judgement. Those details are useful context, but they should not replace the two target conclusions. When I practise, I try to separate background information from evaluation language. Background tells me what happened; evaluation tells me what the speaker finally thinks about it. I also listen for changes in certainty. Words such as 'probably', 'only', 'not always', 'unlikely', and 'depends' can completely change which option is accurate. If two answers share similar vocabulary, the safer choice is the one that matches the strength and direction of the speaker's final judgement.","questions":[{"id":"L4_T04_Q01","no":1,"options":["It has the consistent quality throughout","Its quality changes considerably from one episode to another.","Some episodes are much weaker than the others."],"answer_index":0,"key_vi":{"answer":"Nó có chất lượng ổn định xuyên suốt","explanation":"Chọn phương án khớp với kết luận cuối cùng của người nói. Các lựa chọn còn lại có thể được nhắc đến trong bài nhưng bị giới hạn, sửa lại hoặc bác bỏ.","evidence_en":"steady"}},{"id":"L4_T04_Q02","no":2,"options":["Viewer habits influence the way that series are made","The series is made without considering its audience.","Viewer preferences have little effect on production decisions."],"answer_index":0,"key_vi":{"answer":"Thói quen của người xem ảnh hưởng đến cách các bộ phim truyền hình dài tập được sản xuất","explanation":"Chọn phương án khớp với kết luận cuối cùng của người nói. Các lựa chọn còn lại có thể được nhắc đến trong bài nhưng bị giới hạn, sửa lại hoặc bác bỏ.","evidence_en":"audience"}}]}}}],"pack_version":"1.0.0","min_app_version":"3.3","__pack_source":"bundled","__pack_version":"1.0.0"},{"schema_version":"3.2","pack_id":"LISTENING_PACK_05_06_V3_2","title":"APTIS Listening Pack 05–06 · Canonical V1.2","canonical_source":"APTIS_DATA_CANONICAL_V1_2","voice_engine":"Web Speech API","notes":{"scope":"Two additional listening sets for APTIS Complete Trainer V3.2 and later compatible builds.","l1_policy":"24 valid MCQ items per set, continuing sequentially after Set 04. Q103/Q122/Q138 omitted for visibly broken/non-English OCR; Q135/Q151 omitted because no generated-practice audio item exists. Raw source is preserved for every included item.","display_cleaning":"Only obvious display/OCR grammar artifacts are repaired in question_en; source_question_raw remains unchanged. Answer indices and source concepts are unchanged.","l3_voice_compatibility":"L3 script segments use M/F speaker labels and are compatible with the app gender-lock rule (Man=male voice, Woman=female voice even when Random voice is enabled).","l4_shuffle_compatibility":"L4 source answer_index remains canonical. The latest app shuffles displayed A/B/C each time L4 is reopened and maps scoring/key back to the source answer.","provenance":"L1 scripts, L3 dialogues, L4 monologues and L2 extra distractors are GENERATED_PRACTICE; source questions/answers/transcripts remain marked SOURCE."},"sets":[{"set_id":"SET_05","title":"Listening Set 05 · Environment, Actors & Famous Writers","parts":{"L1":[{"id":"L1_Q101","source_ref":"L1_Q101","source_question_raw":"Where do they go when they travel to India?","source_options_raw":["Go to the park","Go to famous places","Go out to eat"],"question_en":"Where do they go when they travel to India?","options":["Go to the park","Go to famous places","Go out to eat"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_t
