ns for business or travel.","source_sentence_after":"Thanks to the great development of means of transport, today people can travel to other parts of the world.","before_anchor_check":"PASS","after_anchor_check":"PASS","guidance_status":"DERIVED_FROM_ADJACENT_SOURCE_SENTENCES"}],"qa_issues":["R23_T01 link 2: anchor containment failed","R23_T02 link 4: anchor containment failed","R23_T03 link 1: anchor containment failed","R23_T03 link 3: anchor containment failed","R23_T04 link 3: anchor containment failed","R23_T05 link 2: anchor containment failed","R23_T06 link 4: anchor containment failed","R23_T08 link 2: anchor containment failed","R23_T10 link 1: anchor containment failed","R23_T10 link 2: anchor containment failed","R23_T10 link 3: anchor containment failed","R23_T10 link 4: anchor containment failed","R23_T12 link 1: anchor containment failed","R23_T12 link 3: anchor containment failed","R23_T13 link 1: anchor containment failed","R23_T13 link 2: anchor containment failed","R23_T13 link 3: anchor containment failed","R23_T13 link 4: anchor containment failed"],"validation":{"topic_count_expected":13,"topic_count_actual":13,"sentence_count_expected":65,"sentence_count_actual":65,"link_count_expected":52,"link_count_actual":52,"duplicate_sentence_ids":[],"duplicate_link_ids":[],"title_mismatches":[],"lead_structure_mismatches":[],"link_anchor_failures":[],"source_numbering_gap":"Canonical V1.2 / Thay Quy(3): printed numbering 1-11, 13, 13.","passed_full_r23_structure":true}},"R4":{"schema_version":"1.1","stage":"Stage 2B - Reading Part 4 full source content","created_date":"2026-09-20","sources":[{"type":"teacher_material","file":"reading part 4(1).docx","role":"Vietnamese passages + Vietnamese questions + answers"},{"type":"public_app_source","url":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","role":"English questions + answers + highlighted evidence + English passages available externally"}],"policy":{"preserve_source_text":true,"do_not_translate_back_and_call_it_source":true,"derived_fields_are_labeled":true,"trap_authoring_deferred":true},"coverage":{"topics":6,"persons":24,"questions":42},"topics":[{"topic_id":"R4_T01","teacher_title":"1. CÁC HOẠT ĐỘNG THỜI THƠ ẤU","topic_en":"1. CHILDHOOD ACTIVITIES","persons":4,"questions":7,"answer_mismatches":"","content_status":"VERIFIED_CORE","english_passage_status":"INGESTED_FROM_PUBLIC_APP_SOURCE","passages_en":{"A":"As a child, I spent countless hours playing board games with my friends. The rules were simple and easy to grasp, which made the games enjoyable and accessible. As I grew older, I came to believe that board games could be a wonderful way for families to bond. However, modern games have become far more complex, with numerous rules and a wide range of characters to choose from. Although I truly enjoyed playing with my two boys and we often laughed together, I found that learning how to play required quite a bit of effort.","B":"I preferred playing outdoors with my friends when I was small. Fortunately, the weather where we lived was usually pleasant, so we often spent hours running around and chasing each other on the field. At times, we would lie down on the grass and make funny faces, enjoying the carefree moments of childhood. Those memories remain incredibly precious to me and shaped my desire to be surrounded by people. Even now, I find it difficult to stay at home alone for long.","C":"I wasn't able to move much as a child and even now. Instead, I was captivated by books and often preferred reading in my free time. There was a library I frequently visited, where I could lose myself in different stories for hours. Nowadays, I don't read as much as I used to, but I also don't go out very often because I spend time on my computer. I especially enjoy interactive games, as they allow me to socialise and connect with people online.","D":"I love playing outdoors. On gloomy days, which happened quite often, I would stare sadly out of the window, wishing I could be outside. There wasn't much to do indoors back then -until one day my mother surprised me with a box full of art supplies. Inside were vibrant palettes, paintbrushes of different sizes, and stacks of clean paper. That was the moment I discovered another passion: painting. I could spend hours simply gazing at a blank canvas, imagining what picture I might bring to life next."},"exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"topic_id":"R4_T02","teacher_title":"Le hoi am nhac","topic_en":"2. MUSIC FESTIVAL","persons":4,"questions":7,"answer_mismatches":"","content_status":"VERIFIED_CORE","english_passage_status":"INGESTED_FROM_PUBLIC_APP_SOURCE","passages_en":{"A":"This is my first time going to a concert, and the experience was quite mixed. During the first two days, the music was rather ordinary, and the event would have been far more enjoyable if there had been just a little sunshine to brighten things up. Luckily, the last day completely changed my impression, as I finally got to see my favorite singers. Meeting them and enjoying the performances made the whole trip memorable and truly special.","B":"I attend music festivals every year, and over time it has become something of a personal tradition. I really enjoy the energetic atmosphere where people come together to share music and excitement. This particular festival, however, felt quite different from what I am used to. The weather conditions were less than perfect, though it didn't bother me that much, as I have enjoyed festivals in the rain before. The venue was moderately convenient and the performances themselves were rather unremarkable. To be honest, I doubt I will choose to come back in the future.","C":"I don't like one particular type of music being played at festivals, as I much prefer a variety of genres to enjoy and dance to. Luckily, this event truly lived up to what I was hoping for. The songs and melodies were absolutely impressive, leaving a strong impression on me. Although there was some rain, I actually felt it made the atmosphere even more vibrant and fun. One drawback, however, was the ticket price was quite high, which many students, including me, found difficult to afford.","D":"My band and I were invited to play at this festival, and we delivered the kind of performance our audience has come to expect from us. The show turned out to be truly memorable, not only because of the energy on stage but also because some of our former members and past collaborators were present. It felt great to reconnect with them and share stories after the performance. The atmosphere overall was very positive, and the crowd seemed to enjoy every moment. The only real challenge was that the venue was located quite far from the main road, which made moving our instruments and equipment rather inconvenient."},"exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"topic_id":"R4_T03","teacher_title":"THỂ THAO MẠO HIỂM","topic_en":"3. EXTREME SPORT","persons":4,"questions":7,"answer_mismatches":"","content_status":"VERIFIED_CORE","english_passage_status":"INGESTED_FROM_PUBLIC_APP_SOURCE","passages_en":{"A":"Before trying any extreme sport, I believe it's absolutely essential to train properly. These kinds of activities are exciting, but they can also be dangerous if you don't know what you're doing. I've seen people get hurt because they didn't prepare well. That's why I always make sure to take a training course and understand the safety rules before I try anything new. With the right preparation, I think extreme sports can be a great experience.","B":"I've always been more into traditional sports like swimming, running, or playing tennis. They're fun and easy to do regularly. But a few months ago, I went bungee jumping during a holiday, and it was an incredible experience. I didn't expect to enjoy it so much! I still prefer regular sports for everyday fitness, but now I'm definitely more open to trying extreme sports once in a while for adventure.","C":"What I love most about extreme sports is how they let me enjoy nature in a different way. Activities like rock climbing or mountain biking allow me to explore amazing places while challenging myself physically and mentally. It's a way to disconnect from daily life and feel completely alive. If I had more time and money, I'd love to do these kinds of sports more often, especially in wild, remote areas.","D":"I know some people find extreme sports exciting, but for me, they've never been important. I actually avoid them as much as possible. I don't like the idea of putting myself in danger just for fun. There are plenty of safer ways to stay active and enjoy life. I'd rather go for a walk or do yoga than jump out of a plane or climb a mountain. It's just not my thing."},"exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"topic_id":"R4_T04","teacher_title":"4. CÂN BẰNG CÔNG VIỆC - CUỘC SỐNG","topic_en":"5. WORK - LIFE BALANCE","persons":4,"questions":7,"answer_mismatches":"","content_status":"VERIFIED_CORE","english_passage_status":"INGESTED_FROM_PUBLIC_APP_SOURCE","passages_en":{"A":"When I was little, I loved playing board games with my parents after they got home from work. Now, I do the same with my own children, and my four-day work week gives us even more time together. Having a flexible schedule helps, but I still plan carefully to keep a good balance between my job and family life. These moments mean a lot and leave lasting memories.","B":"As a child, I used to play pretend offices with my friends, using toy phones and notebooks. I liked being the \"boss\" and organizing tasks. Those playful moments actually taught me how to be organized and lead others — I still laugh when I think about how serious our \"meetings\" were.","C":"When I was a kid, I loved reading books about different professions and imagining what I'd be when I grew up. Those stories inspired me to be ambitious. Now, I use productivity apps to manage my work during a four-day week. They make things more efficient, but I still feel that same excitement I had when planning my future.","D":"As a child, I spent my evenings playing tag with neighborhood friends. On rainy days, I often felt bored staying indoors. Nowadays, I practice mindfulness to relax after work. It keeps me focused and energized — especially since my shorter workweek allows more time to recharge."},"exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"topic_id":"R4_T05","teacher_title":"5. HOẠT ĐỘNG TÌNH NGUYỆN","topic_en":"6. VOLUNTEERING","persons":4,"questions":7,"answer_mismatches":"","content_status":"VERIFIED_CORE","english_passage_status":"INGESTED_FROM_PUBLIC_APP_SOURCE","passages_en":{"A":"Some people enjoy volunteering abroad, but honestly, I feel most people are more interested in travelling. I believe we should use our time more meaningfully. Each town has many people in need. Their situations are difficult, and they don't have the means to improve their quality of life. They are individuals who have contributed a lot to the country. Sharing stories with them helps us understand the differences between generations. We can also broaden our knowledge about local history, traditions, and culture through their experiences.","B":"My mother told me to do local volunteering because she is part of that organisation, but I'm not into it. I prefer volunteering abroad because I can develop soft skills — something that will benefit my future career. Also, meeting new people helps me expand my network and create valuable connections I can use later in my professional life.","C":"I'm too busy and rarely have any free time to do anything, so spending even a few hours volunteering is difficult. I would have to take half a day off work. I see many people in need and they genuinely require some extra financial support. That's something I can help with because I earn a good salary. Making monthly donations is not a problem for me — it's how I show my support and contribution.","D":"I believe there are many ways we can show kindness through volunteering. I'm retired now, and I currently help build houses for people in need. I work with a volunteering organisation that already has clear plans in place. Through this work, I've had the chance to experience different foreign cultures. We're often sent to various countries to carry out these projects, so it's also a great way to travel while doing something meaningful. The job involves manual labour, so we're able to improve our physical health — something that some people only begin to notice after a while."},"exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"topic_id":"R4_T06","teacher_title":"6. NGHỀ NGHIỆP","topic_en":"7. CAREER","persons":4,"questions":7,"answer_mismatches":"","content_status":"VERIFIED_CORE","english_passage_status":"INGESTED_FROM_PUBLIC_APP_SOURCE","passages_en":{"A":"When I finished school, I didn't really know what I wanted to do. Some people advised me to get a job right away. However, I preferred to gain some practical experience first. That's why I applied for many volunteering roles. Even though I didn't earn any money, I was able to try different kinds of work. Looking back, I'm happy with my decision because of the useful knowledge I gained.","B":"I went straight to university after I graduated from high school. I had always wanted to become a teacher, so there was no need to look at other careers. Three months ago, I joined an internship at a local school. It was really an eye-opening experience, although the workload was heavier than I thought. Still, I believe it was very worthwhile.","C":"As a child, I lived near a plumber and sometimes worked with her. She asked me to do easy jobs like checking for pipe leaks or fastening the nails with a screw. So later, it felt natural for me to study at university to become an electrician. Now that I see there are short online electrical courses, I wish I had chosen that instead.","D":"After school, I wanted some time to figure out what I really wanted. So I started looking for temporary jobs. However, it was difficult to find one because most companies didn't accept people without experience. In the end, a game company contacted me and I agreed to work with them. The job was hybrid, so sometimes I worked in the evenings, but that was fine for me."},"exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"}],"items":[{"id":"R4_T01_Q01","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T01","topic_en":"1. CHILDHOOD ACTIVITIES","topic_vi":"1. CÁC HOẠT ĐỘNG THỜI THƠ ẤU","question_no":1,"question_en":"Who enjoyed playing games with their children?","question_vi":"Ai thích chơi trò chơi với con cái của họ?","options":["A","B","C","D"],"answer":"A","question_key":"enjoyed playing games with their children","evidence_en":"enjoyed playing with my two boys","evidence_person":"A","hint_vi":"thích chơi trò chơi với con cái của họ","trap":null,"paraphrase_relation":"enjoyed playing games with their children ↔ enjoyed playing with my two boys","passages_vi":{"A":"Khi còn nhỏ, tôi đã dành vô số giờ để chơi trò chơi trên bàn cờ với bạn bè. Luật chơi rất đơn giản và dễ hiểu, điều đó khiến các trò chơi trở nên thú vị và dễ tiếp cận. Khi lớn lên, tôi bắt đầu tin rằng trò chơi trên bàn cờ có thể là một cách tuyệt vời để các gia đình gắn kết với nhau. Tuy nhiên, các trò chơi hiện đại đã trở nên phức tạp hơn rất nhiều, với vô số luật lệ và một loạt các nhân vật để lựa chọn. Mặc dù tôi thực sự thích chơi với hai cậu con trai của mình và chúng tôi thường cười đùa cùng nhau, nhưng tôi nhận thấy rằng việc học cách chơi đòi hỏi khá nhiều nỗ lực.","B":"Tôi thích chơi ngoài trời hơn với bạn bè khi tôi còn nhỏ. May mắn thay, thời tiết ở nơi chúng tôi sống thường rất dễ chịu, vì vậy chúng tôi thường dành hàng giờ chạy nhảy và đuổi bắt nhau trên cánh đồng. Đôi khi, chúng tôi nằm dài trên bãi cỏ và làm mặt hề, tận hưởng những khoảnh khắc vô tư của tuổi thơ. Những kỷ niệm đó vẫn còn vô cùng quý giá đối với tôi và đã hình thành nên mong muốn của tôi được ở bên mọi người. Cho đến tận bây giờ, tôi vẫn cảm thấy khó khăn khi phải ở nhà một mình trong thời gian dài.","C":"Tôi không thể vận động nhiều khi còn nhỏ và cả bây giờ nữa. Thay vào đó, tôi bị cuốn hút bởi những cuốn sách và thường thích đọc sách trong thời gian rảnh. Có một thư viện tôi thường lui tới, nơi tôi có thể đắm mình trong những câu chuyện khác nhau trong nhiều giờ. Ngày nay, tôi không đọc nhiều như trước nữa, nhưng tôi cũng không ra ngoài thường xuyên vì tôi dành thời gian trên máy tính. Tôi đặc biệt thích các trò chơi tương tác, vì chúng cho phép tôi giao lưu và kết nối với mọi người trực tuyến.","D":"Tôi thích chơi ngoài trời. Vào những ngày u ám, điều khá thường xuyên xảy ra, tôi thường buồn bã nhìn ra ngoài cửa sổ, ước gì mình có thể ra ngoài. Hồi đó không có nhiều thứ để làm trong nhà - cho đến một ngày mẹ tôi làm tôi ngạc nhiên với một hộp đựng đầy đồ dùng nghệ thuật. Bên trong là những bảng màu rực rỡ, cọ vẽ với nhiều kích cỡ khác nhau và những chồng giấy trắng sạch sẽ. Đó là khoảnh khắc tôi khám phá ra một niềm đam mê khác: hội họa. Tôi có thể dành hàng giờ chỉ để ngắm nhìn một bức tranh trống, tưởng tượng ra bức ảnh nào tôi sẽ mang đến sự sống tiếp theo."},"passage_en":"As a child, I spent countless hours playing board games with my friends. The rules were simple and easy to grasp, which made the games enjoyable and accessible. As I grew older, I came to believe that board games could be a wonderful way for families to bond. However, modern games have become far more complex, with numerous rules and a wide range of characters to choose from. Although I truly enjoyed playing with my two boys and we often laughed together, I found that learning how to play required quite a bit of effort.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":6,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":1,"public_app_question_id":1},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T01_Q02","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T01","topic_en":"1. CHILDHOOD ACTIVITIES","topic_vi":"1. CÁC HOẠT ĐỘNG THỜI THƠ ẤU","question_no":2,"question_en":"Who enjoyed playing with their friends as a child?","question_vi":"Ai thích chơi với bạn bè khi còn nhỏ?","options":["A","B","C","D"],"answer":"B","question_key":"enjoyed playing with their friends as a child","evidence_en":"playing outdoors with my friends when I was small","evidence_person":"B","hint_vi":"thích chơi với bạn bè khi còn nhỏ","trap":null,"paraphrase_relation":"enjoyed playing with their friends as a child ↔ playing outdoors with my friends when I was small","passages_vi":{"A":"Khi còn nhỏ, tôi đã dành vô số giờ để chơi trò chơi trên bàn cờ với bạn bè. Luật chơi rất đơn giản và dễ hiểu, điều đó khiến các trò chơi trở nên thú vị và dễ tiếp cận. Khi lớn lên, tôi bắt đầu tin rằng trò chơi trên bàn cờ có thể là một cách tuyệt vời để các gia đình gắn kết với nhau. Tuy nhiên, các trò chơi hiện đại đã trở nên phức tạp hơn rất nhiều, với vô số luật lệ và một loạt các nhân vật để lựa chọn. Mặc dù tôi thực sự thích chơi với hai cậu con trai của mình và chúng tôi thường cười đùa cùng nhau, nhưng tôi nhận thấy rằng việc học cách chơi đòi hỏi khá nhiều nỗ lực.","B":"Tôi thích chơi ngoài trời hơn với bạn bè khi tôi còn nhỏ. May mắn thay, thời tiết ở nơi chúng tôi sống thường rất dễ chịu, vì vậy chúng tôi thường dành hàng giờ chạy nhảy và đuổi bắt nhau trên cánh đồng. Đôi khi, chúng tôi nằm dài trên bãi cỏ và làm mặt hề, tận hưởng những khoảnh khắc vô tư của tuổi thơ. Những kỷ niệm đó vẫn còn vô cùng quý giá đối với tôi và đã hình thành nên mong muốn của tôi được ở bên mọi người. Cho đến tận bây giờ, tôi vẫn cảm thấy khó khăn khi phải ở nhà một mình trong thời gian dài.","C":"Tôi không thể vận động nhiều khi còn nhỏ và cả bây giờ nữa. Thay vào đó, tôi bị cuốn hút bởi những cuốn sách và thường thích đọc sách trong thời gian rảnh. Có một thư viện tôi thường lui tới, nơi tôi có thể đắm mình trong những câu chuyện khác nhau trong nhiều giờ. Ngày nay, tôi không đọc nhiều như trước nữa, nhưng tôi cũng không ra ngoài thường xuyên vì tôi dành thời gian trên máy tính. Tôi đặc biệt thích các trò chơi tương tác, vì chúng cho phép tôi giao lưu và kết nối với mọi người trực tuyến.","D":"Tôi thích chơi ngoài trời. Vào những ngày u ám, điều khá thường xuyên xảy ra, tôi thường buồn bã nhìn ra ngoài cửa sổ, ước gì mình có thể ra ngoài. Hồi đó không có nhiều thứ để làm trong nhà - cho đến một ngày mẹ tôi làm tôi ngạc nhiên với một hộp đựng đầy đồ dùng nghệ thuật. Bên trong là những bảng màu rực rỡ, cọ vẽ với nhiều kích cỡ khác nhau và những chồng giấy trắng sạch sẽ. Đó là khoảnh khắc tôi khám phá ra một niềm đam mê khác: hội họa. Tôi có thể dành hàng giờ chỉ để ngắm nhìn một bức tranh trống, tưởng tượng ra bức ảnh nào tôi sẽ mang đến sự sống tiếp theo."},"passage_en":"I preferred playing outdoors with my friends when I was small. Fortunately, the weather where we lived was usually pleasant, so we often spent hours running around and chasing each other on the field. At times, we would lie down on the grass and make funny faces, enjoying the carefree moments of childhood. Those memories remain incredibly precious to me and shaped my desire to be surrounded by people. Even now, I find it difficult to stay at home alone for long.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":7,"public_app_sour te a bit of effort.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":8,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":1,"public_app_question_id":3},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T01_Q04","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T01","topic_en":"1. CHILDHOOD ACTIVITIES","topic_vi":"1. CÁC HOẠT ĐỘNG THỜI THƠ ẤU","question_no":4,"question_en":"Who wished they could spend more time outdoors?","question_vi":"Ai ước mình có thể dành nhiều thời gian ở ngoài trời hơn?","options":["A","B","C","D"],"answer":"D","question_key":"wished they could spend more time outdoors","evidence_en":"wishing I could be outside","evidence_person":"D","hint_vi":"ước mình có thể dành nhiều thời gian ở ngoài trời hơn","trap":null,"paraphrase_relation":"wished they could spend more time outdoors ↔ wishing I could be outside","passages_vi":{"A":"Khi còn nhỏ, tôi đã dành vô số giờ để chơi trò chơi trên bàn cờ với bạn bè. Luật chơi rất đơn giản và dễ hiểu, điều đó khiến các trò chơi trở nên thú vị và dễ tiếp cận. Khi lớn lên, tôi bắt đầu tin rằng trò chơi trên bàn cờ có thể là một cách tuyệt vời để các gia đình gắn kết với nhau. Tuy nhiên, các trò chơi hiện đại đã trở nên phức tạp hơn rất nhiều, với vô số luật lệ và một loạt các nhân vật để lựa chọn. Mặc dù tôi thực sự thích chơi với hai cậu con trai của mình và chúng tôi thường cười đùa cùng nhau, nhưng tôi nhận thấy rằng việc học cách chơi đòi hỏi khá nhiều nỗ l her passion: painting. I could spend hours simply gazing at a blank canvas, imagining what picture I might bring to life next.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":9,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":1,"public_app_question_id":4},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T01_Q05","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T01","topic_en":"1. CHILDHOOD ACTIVITIES","topic_vi":"1. CÁC HOẠT ĐỘNG THỜI THƠ ẤU","question_no":5,"question_en":"Who enjoyed doing arts as a child?","question_vi":"Ai thích làm nghệ thuật khi còn nhỏ?","options":["A","B","C","D"],"answer":"D","question_key":"enjoyed doing arts as a child","evidence_en":"discovered another passion: painting","evidence_person":"D","hint_vi":"thích làm nghệ thuật khi còn nhỏ","trap":null,"paraphrase_relation":"enjoyed doing arts as a child ↔ discovered another passion: painting","passages_vi":{"A":"Khi còn nhỏ, tôi đã dành vô số giờ để chơi trò chơi trên bàn cờ với bạn bè. Luật chơi rất đơn giản và dễ hiểu, điều đó khiến các trò chơi trở nên thú vị và dễ tiếp cận. Khi lớn lên, tôi bắt đầu tin rằng trò chơi trên bàn cờ có thể là một cách tuyệt vời để các gia đình gắn kết với nhau. Tuy nhiên, các trò chơi hiện đại đã trở nên phức tạp hơn rất nhiều, với vô số luật lệ và một loạt các nhân vật để lựa chọn. Mặc dù tôi thực sự thích chơi với hai cậu con trai của mình và chúng tôi thường cười đùa cùng nhau, nhưng tôi nhận thấy nd time on my computer. I especially enjoy interactive games, as they allow me to socialise and connect with people online.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":12,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":1,"public_app_question_id":7},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T02_Q01","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T02","topic_en":"2. MUSIC FESTIVAL","topic_vi":"Le hoi am nhac","question_no":1,"question_en":"Who is disappointed with the weather?","question_vi":"Ai thất vọng về thời tiết?","options":["A","B","C","D"],"answer":"A","question_key":"is disappointed with the weather","evidence_en":"if there had been just a little sunshine","evidence_person":"A","hint_vi":"thất vọng về thời tiết","trap":null,"paraphrase_relation":"is disappointed with the weather ↔ if there had been just a little sunshine","passages_vi":{"A":"Đây là lần đầu tiên tôi đến một buổi hòa nhạc, và trải nghiệm khá là trái chiều. Trong hai ngày đầu tiên, âm nhạc khá bình thường, và sự kiện sẽ thú vị hơn rất nhiều nếu có một chút ánh nắng để làm bừng sáng mọi thứ. May mắn thay, ngày cuối cùng đã hoàn toàn thay đổi ấn tượng của tôi, vì cuối cùng tôi cũng được gặp những ca sĩ yêu thích của mình. Gặp gỡ họ và thưởng thức những màn trình diễn đã khiến toàn bộ chuyến đi trở nên đáng nhớ và thực sự đặc biệt.","B":"Tôi tham dự các lễ hội âm nhạc mỗi năm, và theo thời gian, điều đó đã trở thành một truyền thống cá nhân của tôi. Tôi thực sự thích bầu không khí sôi động, nơi mọi người đến với nhau để chia sẻ âm nhạc và niềm vui. Tuy nhiên, lễ hội năm nay có cảm giác khá khác so với những gì tôi đã quen. Điều kiện thời tiết không được lý tưởng cho lắm, mặc dù điều đó không làm tôi bận tâm quá nhiều, vì tôi đã từng tham gia lễ hội dưới mưa trước đây. Địa điểm tương đối thuận tiện và các màn trình diễn cũng khá bình thường. Thành thật mà nói, tôi nghi ngờ rằng mình sẽ chọn quay lại trong tương lai.","C":"Tôi không thích một loại nhạc cụ thể nào được chơi tại các lễ hội, vì tôi thích sự đa dạng của nhiều thể loại để thưởng thức và nhảy theo. May mắn thay, sự kiện này thực sự đáp ứng những gì tôi đã hy vọng. Các bài hát và giai điệu thực sự ấn tượng, để lại cho tôi một ấn tượng sâu sắc. Mặc dù có một chút mưa, nhưng tôi thực sự cảm thấy điều đó khiến bầu không khí trở nên sôi động và vui nhộn hơn. Tuy nhiên, một điểm trừ là giá vé khá cao, điều mà nhiều sinh viên, bao gồm cả tôi, cảm thấy khó có thể chi trả.","D":"Ban nhạc của tôi và tôi đã được mời đến biểu diễn tại lễ hội này, và chúng tôi đã mang đến một màn trình diễn đúng như những gì khán giả của chúng tôi mong đợi. Buổi biểu diễn thực sự trở nên đáng nhớ, không chỉ vì năng lượng trên sân khấu mà còn vì một số thành viên cũ và cộng tác viên trước đây của chúng tôi đã có mặt. Thật tuyệt vời khi được kết nối lại với họ và chia sẻ những câu chuyện sau buổi biểu diễn. Bầu không khí nhìn chung rất tích cực, và khán giả dường như tận hưởng từng khoảnh khắc. Thách thức thực sự duy nhất là địa điểm nằm khá xa đường chính, điều này khiến việc di chuyển nhạc cụ và thiết bị của chúng tôi khá bất tiện."},"passage_en":"This is my first time going to a concert, and the experience was quite mixed. During the first two days, the music was rather ordinary, and the event would have been far more enjoyable if there had been just a little sunshine to brighten things up. Luckily, the last day completely changed my impression, as I finally got to see my favorite singers. Meeting them and enjoying the performances made the whole trip memorable and truly special.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":19,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":2,"public_app_question_id":1},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T02_Q02","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T02","topic_en":"2. MUSIC FESTIVAL","topic_vi":"Le hoi am nhac","question_no":2,"question_en":"Who was not impressed by the event overall?","question_vi":"Ai không bị ấn tượng bởi sự kiện nói chung?","options":["A","B","C","D"],"answer":"B","question_key":"was not impressed by the event overall","evidence_en":"I doubt I will choose to come back in the future","evidence_person":"B","hint_vi":"không bị ấn tượng bởi sự kiện nói chung","trap":null,"paraphrase_relation":"was not impressed by the event overall ↔ I doubt I will choose to come back in the future","passages_vi":{"A":"Đây là lần đầu tiên tôi đến một buổi hòa nhạc, và trải nghiệm khá là trái chiều. Trong hai ngày đầu tiên, âm nhạc khá bình thường, và sự kiện sẽ thú vị hơn rất nhiều nếu có một chút ánh nắng để làm bừng sáng mọi thứ. May mắn thay, ngày cuối cùng đã hoàn toàn thay đổi ấn tượng của tôi, vì cuối cùng tôi cũng được gặp những ca sĩ yêu thích của mình. Gặp gỡ họ và thưởng thức những màn trình diễn đã khiến toàn bộ chuyến đi trở nên đáng nhớ và thực sự đặc biệt.","B":"Tôi tham dự các lễ h fferent from what I am used to. The weather conditions were less than perfect, though it didn't bother me that much, as I have enjoyed festivals in the rain before. The venue was moderately convenient and the performances themselves were rather unremarkable. To be honest, I doubt I will choose to come back in the future.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":20,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":2,"public_app_question_id":2},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T02_Q03","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T02","topic_en":"2. MUSIC FESTIVAL","topic_vi":"Le hoi am nhac","question_no":3,"question_en":"Who enjoyed all the music at the music event?","question_vi":"Ai thích tất cả các bản nhạc tại sự kiện âm nhạc?","options":["A","B","C","D"],"answer":"C","question_key":"enjoyed all the music at the music event","evidence_en":"prefer a variety of genres to enjoy","evidence_person":"C","hint_vi":"thích tất cả các bản nhạc tại sự kiện âm nhạc","trap":null,"paraphrase_relation":"enjoyed all the music at the music event ↔ prefer a variety of genres to enjoy","passages_vi":{"A":"Đây là lần đầu tiên tôi đến một buổi hòa nhạc, và trải nghiệm khá là trái chiều. Trong hai ngày đầu tiên, âm nhạc khá bình thường, và sự kiện sẽ thú vị hơn rất nhiều nếu có một chút ánh nắng để làm bừng sáng mọi thứ. May mắn thay, ngày cuối cùng đã hoàn toàn thay đổi ấn tượng của tôi, vì cuối cùng tôi cũng được gặp những ca sĩ yêu thích của mình. Gặp gỡ họ và thưởng thức những màn trình diễn đã khiến toàn bộ chuyến đi trở nên đáng nhớ và thực sự đặc biệt.","B":"Tôi tham dự các lễ hội âm nhạc mỗi năm, và theo thời gian, điều đó đã trở thành một truyền thống cá nhân của tôi. Tôi thực sự thích bầu không khí sôi động, nơi mọi người đến với nhau để chia sẻ âm nhạc và niềm vui. Tuy nhiên, lễ hội năm nay có cảm giác khá khác so với những gì tôi đã quen. Điều kiện thời tiết không được lý tưởng cho lắm, mặc dù điều đó không làm tôi bận tâm quá nhiều, vì tôi đã từng tham gia lễ hội dưới mưa trước đây. Địa điểm tương đối thuận tiện và các màn trình diễn cũng khá bình thường. Thành thật mà nói, tôi nghi ngờ rằng mình sẽ chọn quay lại trong tương lai.","C":"Tôi không thích một loại nhạc cụ thể nào được chơi tại các lễ hội, vì tôi thích sự đa dạng của nhiều thể loại để thưởng thức và nhảy theo. May mắn thay, sự kiện này thực sự đáp ứng những gì tôi đã hy vọng. Các bài hát và giai điệu thực sự ấn tượng, để lại cho tôi một ấn tượng sâu sắc. Mặc dù có một chút mưa, nhưng tôi thực sự cảm thấy điều đó khiến bầu không khí trở nên sôi động và vui nhộn hơn. Tuy nhiên, một điểm trừ là giá vé khá cao, điều mà nhiều sinh viên, bao gồm cả tôi, cảm thấy khó có thể chi trả.","D":"Ban nhạc của tôi và tôi đã được mời đến biểu diễn tại lễ hội này, và chúng tôi đã mang đến một màn trình diễn đúng như những gì khán giả của chúng tôi mong đợi. Buổi biểu diễn thực sự trở nên đáng nhớ, không chỉ vì năng lượng trên sân khấu mà còn vì một số thành viên cũ và cộng tác viên trước đây của chúng tôi đã có mặt. Thật tuyệt vời khi được kết nối lại với họ và chia sẻ những câu chuyện sau buổi biểu diễn. Bầu không khí nhìn chung rất tích cực, và khán giả dường như tận hưởng từng khoảnh khắc. Thách thức thực sự duy nhất là địa điểm nằm khá xa đường chính, điều này khiến việc di chuyển nhạc cụ và thiết bị của chúng tôi khá bất tiện."},"passage_en":"I don't like one particular type of music being played at festivals, as I much prefer a variety of genres to enjoy and dance to. Luckily, this event truly lived up to what I was hoping for. The songs and melodies were absolutely impressive, leaving a strong impression on me. Although there was some rain, I actually felt it made the atmosphere even more vibrant and fun. One drawback, however, was the ticket price was quite high, which many students, including me, found difficult to afford.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":21,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":2,"public_app_question_id":3},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T02_Q04","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T02","topic_en":"2. MUSIC FESTIVAL","topic_vi":"Le hoi am nhac","question_no":4,"question_en":"Who thought the event was expensive?","question_vi":"Ai cho rằng sự kiện này đắt đỏ?","options":["A","B","C","D"],"answer":"C","question_key":"thought the event was expensive","evidence_en":"ticket price was quite high","evidence_person":"C","hint_vi":"cho rằng sự kiện này đắt đỏ","trap":null,"paraphrase_relation":"thought the event was expensive ↔ ticket price was quite high","passages_vi":{"A":"Đây là lần đầu tiên tôi đến một buổi hòa nhạc, và trải nghiệm khá là trái chiều. Trong hai ngày đầu tiên, âm nhạc khá bình thường, và sự kiện sẽ thú vị hơn rất nhiều nếu có một chút ánh nắng để làm bừng sáng mọi thứ. May mắn thay, ngày cuối cùng đã hoàn toàn tha  important","evidence_en":"take a training course and understand the safety rules","evidence_person":"A","hint_vi":"cho rằng việc tập luyện trước khi tham gia là quan trọng","trap":null,"paraphrase_relation":"finds training before participating important ↔ take a training course and understand the safety rules","passages_vi":{"A":"Trước khi thử bất kỳ môn thể thao mạo hiểm nào, tôi tin rằng việc tập luyện đúng cách là hoàn toàn cần thiết. Những hoạt động này rất thú vị, nhưng cũng có thể nguy hiểm nếu bạn không biết mình đang làm gì. Tôi đã thấy nhiều người bị thương vì họ không chuẩn bị kỹ lưỡng. Đó là lý do tại sao tôi luôn đảm bảo tham gia một khóa đào tạo và hiểu rõ các quy tắc an toàn trước khi thử bất cứ điều gì mới. Với sự chuẩn bị đúng đắn, tôi nghĩ thể thao mạo hiểm có thể là một trải nghiệm tuyệt vời.","B":"Tôi luôn thiên về các môn thể thao truyền thống hơn như bơi lội, chạy bộ hoặc chơi quần vợt. Chúng rất vui và dễ dàng để tập luyện thường xuyên. Nhưng vài tháng trước, tôi đã thử nhảy bungee trong một kỳ nghỉ và đó là một trải nghiệm đáng kinh ngạc. Tôi không ngờ mình lại thích nó đến vậy! Tôi vẫn thích các môn thể thao thông thường để rèn luyện sức khỏe hàng ngày, nhưng bây giờ tôi chắc chắn cởi mở hơn với việc thỉnh thoảng thử các môn thể thao mạo hiểm để tìm kiếm cảm giác phiêu lưu.","C":"Điều tôi yêu thích nhất ở các môn thể thao mạo hiểm là cách chúng cho phép tôi tận hưởng thiên nhiên theo một cách khác biệt. Các hoạt động như leo núi đá hay đạp xe địa hình cho phép tôi khám phá những nơi tuyệt vời trong khi thử thách bản thân về thể chất lẫn tinh thần. Đó là cách để tôi tách biệt khỏi cuộc sống hàng ngày và cảm thấy thực sự sống động. Nếu tôi có nhiều thời gian và tiền bạc hơn, tôi rất muốn thực hiện những môn thể thao này thường xuyên hơn, đặc biệt là ở những vùng hoang dã, xa xôi.","D":"Tôi biết một số người thấy thể thao mạo hiểm rất thú vị, nhưng đối với tôi, chúng chưa bao giờ quan trọng. Tôi thực sự tránh chúng nhiều nhất có thể. Tôi không thích ý tưởng tự đặt mình vào nguy hiểm chỉ để giải trí. Có rất nhiều cách an toàn hơn để giữ cơ thể năng động và tận hưởng cuộc sống. Tôi thà đi bộ hoặc tập yoga hơn là nhảy khỏi máy bay hay leo núi. Nó đơn giản không phải là sở thích của tôi."},"passage_en":"Before trying any extreme sport, I believe it's absolutely essential to train properly. These kinds of activities are exciting, but they can also be dangerous if you don't know what you're doing. I've seen people get hurt because they didn't prepare well. That's why I always make sure to take a training course and understand the safety rules before I try anything new. With the right preparation, I think extreme sports can be a great experience.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":32,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":3,"public_app_question_id":1},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T03_Q02","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T03","topic_en":"3. EXTREME SPORT","topic_vi":"THỂ THAO MẠO HIỂM","question_no":2,"question_en":"Who likes traditional sports like swimming?","question_vi":"Ai thích các môn thể thao truyền thống như bơi lội?","options":["A","B","C","D"],"answer":"B","question_key":"likes traditional sports like swimming","evidence_en":"traditional sports like swimming, running, or playing tennis","evidence_person":"B","hint_vi":"thích các môn thể thao truyền thống như bơi lội","trap":null,"parap eo núi. Nó đơn giản không phải là sở thích của tôi."},"passage_en":"I've always been more into traditional sports like swimming, running, or playing tennis. They're fun and easy to do regularly. But a few months ago, I went bungee jumping during a holiday, and it was an incredible experience. I didn't expect to enjoy it so much! I still prefer regular sports for everyday fitness, but now I'm definitely more open to trying extreme sports once in a while for adventure.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":33,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":3,"public_app_question_id":2},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T03_Q03","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T03","topic_en":"3. EXTREME SPORT","topic_vi":"THỂ THAO MẠO HIỂM","question_no":3,"question_en":"Who still likes extreme sports after playing once?","question_vi":"Ai vẫn thích thể thao mạo hiểm sau khi đã chơi một lần?","options":["A","B","C","D"],"answer":"B","question_key":"still likes extreme sports after playing once","evidence_en":"more open to trying extreme sports once in a while","evidence_person":"B","hint_vi":"vẫn thích thể thao mạo hiểm sau khi đã chơi một lần","trap":null,"paraphrase_relation":"still likes extreme sports after playing once ↔ more open to trying extreme sports once in a while","passages_vi":{"A":"Trước khi thử bất kỳ môn thể thao mạo hiểm nào, tôi tin rằng việc tập luyện đúng cách là ạp xe địa hình cho phép tôi khám phá những nơi tuyệt vời trong khi thử thách bản thân về thể chất lẫn tinh thần. Đó là cách để tôi tách biệt khỏi cuộc sống hàng ngày và cảm thấy thực sự sống động. Nếu tôi có nhiều thời gian và tiền bạc hơn, tôi rất muốn thực hiện những môn thể thao này thường xuyên hơn, đặc biệt là ở những vùng hoang dã, xa xôi.","D":"Tôi biết một số người thấy thể thao mạo hiểm rất thú vị, nhưng đối với tôi, chúng chưa bao giờ quan trọng. Tôi thực sự tránh chúng nhiều nhất có thể. Tôi không thích ý tưởng tự đặt mình vào nguy hiểm chỉ để giải trí. Có rất nhiều cách an toàn hơn để giữ cơ thể năng động và tận hưởng cuộc sống. Tôi thà đi bộ hoặc tập yoga hơn là nhảy khỏi máy bay hay leo núi. Nó đơn giản không phải là sở thích của tôi."},"passage_en":"I know some people find extreme sports exciting, but for me, they've never been important. I actually avoid them as much as possible. I don't like the idea of putting myself in danger just for fun. There are plenty of safer ways to stay active and enjoy life. I'd rather go for a walk or do yoga than jump out of a plane or climb a mountain. It's just not my thing.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":37,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":3,"public_app_question_id":6},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T03_Q07","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T03","topic_en":"3. EXTREME SPORT","topic_vi":"THỂ TH người thấy thể thao mạo hiểm rất thú vị, nhưng đối với tôi, chúng chưa bao giờ quan trọng. Tôi thực sự tránh chúng nhiều nhất có thể. Tôi không thích ý tưởng tự đặt mình vào nguy hiểm chỉ để giải trí. Có rất nhiều cách an toàn hơn để giữ cơ thể năng động và tận hưởng cuộc sống. Tôi thà đi bộ hoặc tập yoga hơn là nhảy khỏi máy bay hay leo núi. Nó đơn giản không phải là sở thích của tôi."},"passage_en":"I know some people find extreme sports exciting, but for me, they've never been important. I actually avoid them as much as possible. I don't like the idea of putting myself in danger just for fun. There are plenty of safer ways to stay active and enjoy life. I'd rather go for a walk or do yoga than jump out of a plane or climb a mountain. It's just not my thing.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":38,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":3,"public_app_question_id":7},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T04_Q01","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T04","topic_en":"5. WORK - LIFE BALANCE","topic_vi":"4. CÂN BẰNG CÔNG VIỆC - CUỘC SỐNG","question_no":1,"question_en":"Who enjoys family time with board games?","question_vi":"Ai thích thời gian gia đình với trò chơi trên bàn cờ?","options":["A","B","C","D"],"answer":"A","question_key":"enjoys family time with board games","evidence_en":"playing board games with my parents","evidence_person":"A","hint_vi":"thích thời gian gia đình với trò chơi trên bàn cờ","trap":null,"paraphrase_relation":"enjoys family time with board games ↔ playing board games with my parents","passages_vi":{"A":"Khi còn nhỏ, tôi thích chơi trò chơi trên bàn cờ với bố mẹ sau khi họ đi làm về. Bây giờ, tôi cũng làm điều tương tự với những đứa con của mình, và lịch làm việc bốn ngày một tuần của tôi cho chúng tôi thậm chí còn nhiều thời gian bên nhau hơn. Có một lịch trình linh hoạt rất hữu ích, nhưng tôi vẫn lên kế hoạch cẩn thận để giữ sự cân bằng tốt giữa công việc và cuộc sống gia đình. Những khoảnh khắc này có ý nghĩa rất lớn và để lại những kỷ niệm lâu dài.","B":"Khi còn nhỏ, tôi thường chơi trò giả vờ làm văn phòng với bạn bè, sử dụng điện thoại đồ chơi và sổ tay. Tôi thích làm \"ông chủ\" và sắp xếp các nhiệm vụ. Những khoảnh khắc vui chơi đó thực sự đã dạy tôi cách tổ chức công việc và lãnh đạo người khác — tôi vẫn bật cười khi nghĩ về những \"cuộc họp\" nghiêm túc của chúng tôi ngày ấy.","C":"Khi còn nhỏ, tôi thích đọc sách về các ngành nghề khác nhau và tưởng tượng mình sẽ làm gì khi lớn lên. Những câu chuyện đó đã truyền cảm hứng cho tôi có tham vọng. Bây giờ, tôi sử dụng các ứng dụng năng suất để quản lý công việc trong tuần làm việc bốn ngày. Chúng khiến mọi việc hiệu quả hơn, nhưng tôi vẫn cảm thấy sự hào hứng tương tự như khi tôi lên kế hoạch cho tương lai của mình ngày đó.","D":"Khi còn nhỏ, tôi dành những buổi tối để chơi trò đuổi bắt với những người bạn trong xóm. Vào những ngày mưa, tôi thường cảm thấy buồn chán khi ở trong nhà. Ngày nay, tôi thực hành chánh niệm để thư giãn sau giờ làm việc. Nó giúp tôi tập trung và tràn đầy năng lượng — đặc biệt là vì tuần làm việc ngắn hơn của tôi cho phép nhiều thời gian hơn để nạp lại năng lượng."},"passage_en":"When I was little, I loved playing board games with my parents after they got home from work. Now, I do the same with my own children, and my four-day work week gives us even more time together. Having a flexible schedule helps, but I still plan carefully to keep a good balance between my job and family life. These moments mean a lot and leave lasting memories.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":45,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":4,"public_app_question_id":1},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T04_Q02","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T04","topic_en":"5. WORK - LIFE BALANCE","topic_vi":"4. CÂN BẰNG CÔNG VIỆC - CUỘC SỐNG","question_no":2,"question_en":"Who finds modern schedules more flexible?","question_vi":"Ai thấy lịch trình hiện đại linh hoạt hơn?","options":["A","B","C","D"],"answer":"A","question_key":"finds modern schedules more flexible","evidence_en":"Having a flexible schedule helps","evidence_person":"A","hint_vi":"thấy lịch trình hiện đại linh hoạt hơn","trap":null,"paraphrase_relation":"finds modern schedules more flexible ↔ Having a flexible schedule helps","passages_vi":{"A":"Khi còn nhỏ, tôi thích chơi trò chơi trên bàn cờ với bố mẹ sau khi họ đi làm về. Bây giờ, tôi cũng làm điều tương tự với những đứa con của mình, và lịch làm việc bốn ngày một tuần của tôi cho chúng tôi thậm chí còn nhiều thời gian bên nhau hơn. Có một lịch trình linh hoạt rất hữu ích, nhưng tôi vẫn lên kế hoạch cẩn thận để giữ sự cân bằng tốt giữa công việc và cuộc sống gia đình. Những khoảnh khắc này có ý nghĩa rất lớn và để lại những kỷ niệm lâu dài.","B":"Khi còn nhỏ, tôi thường chơi trò giả vờ làm văn phòng với bạn bè, sử dụng điện thoại đồ chơi và sổ tay. Tôi thích làm \"ông chủ\" và sắp xếp các nhiệm vụ. Những khoảnh khắc vui chơi đó thực sự đã dạy tôi cách tổ chức công việc và lãnh đạo người khác — tôi vẫn bật cười khi nghĩ về những \"cuộc họp\" nghiêm túc của chúng tôi ngày ấy.","C":"Khi còn nhỏ, tôi thích đọc sách về các ngành nghề khác nhau và tưởng tượng mình sẽ làm gì khi lớn lên. Những câu chuyện đó đã truyền cảm hứng cho tôi có tham vọng. Bây giờ, tôi sử dụng các ứng dụng năng suất để quản lý công việc trong tuần làm việc bốn ngày. Chúng khiến mọi việc hiệu quả hơn, nhưng tôi vẫn cảm thấy sự hào hứng tương tự như khi tôi lên kế hoạch cho tương lai của mình ngày đó.","D":"Khi còn nhỏ, tôi dành những buổi tối để chơi trò đuổi bắt với những người bạn trong xóm. Vào những ngày mưa, tôi thường cảm thấy buồn chán khi ở trong nhà. Ngày nay, tôi thực hành chánh niệm để thư giãn sau giờ làm việc. Nó giúp tôi tập trung và tràn đầy năng lượng — đặc biệt là vì tuần làm việc ngắn hơn của tôi cho phép nhiều thời gian hơn để nạp lại năng lượng."},"passage_en":"When I was little, I loved playing board games with my parents after they got home from work. Now, I do the same with my own children, and my four-day work week gives us even more time together. Having a flexible schedule helps, but I still plan carefully to keep a good balance between my job and family life. These moments mean a lot and leave lasting memories.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":46,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":4,"public_app_question_id":2},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FR ư khi tôi lên kế hoạch cho tương lai của mình ngày đó.","D":"Khi còn nhỏ, tôi dành những buổi tối để chơi trò đuổi bắt với những người bạn trong xóm. Vào những ngày mưa, tôi thường cảm thấy buồn chán khi ở trong nhà. Ngày nay, tôi thực hành chánh niệm để thư giãn sau giờ làm việc. Nó giúp tôi tập trung và tràn đầy năng lượng — đặc biệt là vì tuần làm việc ngắn hơn của tôi cho phép nhiều thời gian hơn để nạp lại năng lượng."},"passage_en":"As a child, I used to play pretend offices with my friends, using toy phones and notebooks. I liked being the \"boss\" and organizing tasks. Those playful moments actually taught me how to be organized and lead others — I still laugh when I think about how serious our \"meetings\" were.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":47,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":4,"public_app_question_id":3},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T04_Q04","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T04","topic_en":"5. WORK - LIFE BALANCE","topic_vi":"4. CÂN BẰNG CÔNG VIỆC - CUỘC SỐNG","question_no":4,"question_en":"Who loved reading about careers as a child?","question_vi":"Ai thích đọc về các ngành nghề khi còn nhỏ?","options":["A","B","C","D"],"answer":"C","question_key":"loved reading about careers as a child","evidence_en":"reading books about different professions","evidence_person":"C","hint_vi":"thích đọc về các ngành nghề khi còn nhỏ","trap":nul chán khi ở trong nhà. Ngày nay, tôi thực hành chánh niệm để thư giãn sau giờ làm việc. Nó giúp tôi tập trung và tràn đầy năng lượng — đặc biệt là vì tuần làm việc ngắn hơn của tôi cho phép nhiều thời gian hơn để nạp lại năng lượng."},"passage_en":"As a child, I spent my evenings playing tag with neighborhood friends. On rainy days, I often felt bored staying indoors. Nowadays, I practice mindfulness to relax after work. It keeps me focused and energized — especially since my shorter workweek allows more time to recharge.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":50,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":4,"public_app_question_id":6},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T04_Q07","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T04","topic_en":"5. WORK - LIFE BALANCE","topic_vi":"4. CÂN BẰNG CÔNG VIỆC - CUỘC SỐNG","question_no":7,"question_en":"Who now prefers mindfulness practices?","question_vi":"Ai bây giờ thích thực hành chánh niệm?","options":["A","B","C","D"],"answer":"D","question_key":"now prefers mindfulness practices","evidence_en":"practice mindfulness to relax after work","evidence_person":"D","hint_vi":"bây giờ thích thực hành chánh niệm","trap":null,"paraphrase_relation":"now prefers mindfulness practices ↔ practice mindfulness to relax after work","passages_vi":{"A":"Khi còn nhỏ, tôi thích chơi trò chơi trên bàn cờ với bố mẹ sau khi họ đi làm về. Bây giờ, tôi cũng làm d":7},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T05_Q01","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T05","topic_en":"6. VOLUNTEERING","topic_vi":"5. HOẠT ĐỘNG TÌNH NGUYỆN","question_no":1,"question_en":"Who wants to enhance their future career?","question_vi":"Ai muốn nâng cao sự nghiệp tương lai của mình?","options":["A","B","C","D"],"answer":"B","question_key":"wants to enhance their future career","evidence_en":"benefit my future career","evidence_person":"B","hint_vi":"muốn nâng cao sự nghiệp tương lai của mình","trap":null,"paraphrase_relation":"wants to enhance their future career ↔ benefit my future career","passages_vi":{"A":"Một số người thích làm tình nguyện ở nước ngoài, nhưng thành thật mà nói, tôi cảm thấy hầu hết mọi người quan tâm đến việc đi du lịch hơn. Tôi tin rằng chúng ta nên sử dụng thời gian của mình một cách ý nghĩa hơn. Mỗi thị trấn đều có nhiều người cần giúp đỡ. Hoàn cảnh của họ rất khó khăn và họ không có phương tiện để cải thiện chất lượng cuộc sống. Họ là những cá nhân đã đóng góp rất nhiều cho đất nước. Chia sẻ những câu chuyện với họ giúp chúng ta hiểu được sự khác biệt giữa các thế hệ. Chúng ta cũng có thể mở rộng hiểu biết của mình về lịch sử, truyền thống và văn hóa địa phương thông qua những trải nghiệm của họ.","B":"Mẹ tôi bảo tôi làm tình nguyện tại địa phương vì bà là thành viên của tổ chức đó, nhưng tôi không thích điều đó. Tôi thích làm tình nguyện ở nước ngoài hơn vì tôi có thể phát triển các kỹ năng mềm — điều sẽ có lợi cho sự nghiệp tương lai của tôi. Ngoài ra, gặp gỡ những người mới giúp tôi mở rộng mạng lưới quan hệ và tạo ra những kết nối có giá trị mà tôi có thể sử dụng sau này trong cuộc sống chuyên nghiệp của mình.","C":"Tôi quá bận rộn và hiếm khi có thời gian rảnh để làm bất cứ điều gì, vì vậy việc dành ra dù chỉ vài giờ để làm tình nguyện cũng rất khó khăn. Tôi sẽ phải nghỉ nửa ngày làm việc. Tôi thấy nhiều người đang gặp khó khăn và họ thực sự cần một số hỗ trợ tài chính thêm. Đó là điều tôi có thể giúp được vì tôi có mức lương tốt. Việc quyên góp hàng tháng không phải là vấn đề đối với tôi — đó là cách tôi thể hiện sự hỗ trợ và đóng góp của mình.","D":"Tôi tin rằng có nhiều cách để chúng ta thể hiện lòng tốt thông qua hoạt động tình nguyện. Bây giờ tôi đã nghỉ hưu và hiện đang giúp xây nhà cho những người có hoàn cảnh khó khăn. Tôi làm việc với một tổ chức tình nguyện đã có sẵn kế hoạch rõ ràng. Thông qua công việc này, tôi đã có cơ hội trải nghiệm các nền văn hóa nước ngoài khác nhau. Chúng tôi thường được cử đến nhiều quốc gia khác nhau để thực hiện các dự án này, vì vậy đây cũng là một cách tuyệt vời để đi du lịch trong khi làm điều gì đó có ý nghĩa. Công việc đòi hỏi lao động chân tay, vì vậy chúng tôi có thể cải thiện sức khỏe thể chất của mình — điều mà một số người chỉ bắt đầu nhận ra sau một thời gian."},"passage_en":"My mother told me to do local volunteering because she is part of that organisation, but I'm not into it. I prefer volunteering abroad because I can develop soft skills — something that will benefit my future career. Also, meeting new people helps me expand my network and create valuable connections I can use later in my professional life.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":58,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":5,"public_app_question_id":1},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T05_Q02","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T05","topic_en":"6. VOLUNTEERING","topic_vi":"5. HOẠT ĐỘNG TÌNH NGUYỆN","question_no":2,"question_en":"Who helps support charity work with money?","question_vi":"Ai giúp hỗ trợ công việc từ thiện bằng tiền?","options":["A","B","C","D"],"answer":"C","question_key":"helps support charity work with money","evidence_en":"Making monthly donations is not a problem for me","evidence_person":"C","hint_vi":"giúp hỗ trợ công việc từ thiện bằng tiền","trap":null,"paraphrase_relation":"helps support charity work with money ↔ Making monthly donations is not a problem for me","passages_vi":{"A":"Một số người thích làm tình nguyện ở nước ngoài, nhưng thành thật mà nói, tôi cảm thấy hầu hết mọi người quan tâm đến việc đi du lịch hơn. Tôi tin rằng chúng ta nên sử dụng thời gian của mình một cách ý nghĩa hơn. Mỗi thị trấn đều có nhiều người cần giúp đỡ. Hoàn cảnh của họ rất khó khăn và họ không có phương tiện để cải thiện chất lượng cuộc sống. Họ là những cá nhân đã đóng góp rất nhiều cho đất nước. Chia sẻ những câu chuyện với họ giúp chúng ta hiểu được sự khác biệt giữa các thế hệ. Chúng ta cũng có thể mở rộng hiểu biết của mình về lịch sử, truyền thống và văn hóa địa phương thông qua những trải nghiệm của họ.","B":"Mẹ tôi bảo tôi làm tình nguyện tại địa phương vì bà là thành viên của tổ chức đó, nhưng tôi không thích điều đó. Tôi thích làm tình nguyện ở nước ngoài hơn vì tôi có thể phát triển các kỹ năng mềm — điều sẽ có lợi cho sự nghiệp tương lai của tôi. Ngoài ra, gặp gỡ những người mới giúp tôi mở rộng mạng lưới quan hệ và tạo ra những kết nối có giá trị mà tôi có thể sử dụng sau này trong cuộc sống chuyên nghiệp của mình.","C":"Tôi quá bận rộn và hiếm khi có thời gian rảnh để làm bất cứ điều gì, vì vậy việc dành ra dù chỉ vài giờ để làm tình nguyện cũng rất khó khăn. Tôi sẽ phải nghỉ nửa ngày làm việc. Tôi thấy nhiều người đang gặp khó khăn và họ thực sự cần một số hỗ trợ tài chính thêm. Đó là điều tôi có thể giúp được vì tôi có mức lương tốt. Việc quyên góp hàng tháng không phải là vấn đề đối với tôi — đó là cách tôi thể hiện sự hỗ trợ và đóng góp của mình.","D":"Tôi tin rằng có nhiều cách để chúng ta thể hiện lòng tốt thông qua hoạt động tình nguyện. Bây giờ tôi đã nghỉ hưu và hiện đang giúp xây nhà cho những người có hoàn cảnh khó khăn. Tôi làm việc với một tổ chức tình nguyện đã có sẵn kế hoạch rõ ràng. Thông qua công việc này, tôi đã có cơ hội trải nghiệm các nền văn hóa nước ngoài khác nhau. Chúng tôi thường được cử đến nhiều quốc gia khác nhau để thực hiện các dự án này, vì vậy đây cũng là một cách tuyệt vời để đi du lịch trong khi làm điều gì đó có ý nghĩa. Công việc đòi hỏi lao động chân tay, vì vậy chúng tôi có thể cải thiện sức khỏe thể chất của mình — điều mà một số người chỉ bắt đầu nhận ra sau một thời gian."},"passage_en":"I'm too busy and rarely have any free time to do anything, so spending even a few hours volunteering is difficult. I would have to take half a day off work. I see many people in need and they genuinely require some extra financial support. That's something I can help with because I earn a good salary. Making monthly donations is not a problem for me — it's how I show my support and contribution.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":59,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":5,"public_app_question_id":2},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T05_Q03","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T05","topic_en":"6. VOLUNTEERING","topic_vi":"5. HOẠT ĐỘNG TÌNH NGUYỆN","question_no":3,"question_en":"Who thinks it should help the local community?","question_vi":"Ai cho rằng nên giúp đỡ cộng đồng địa phương?","options":["A","B","C","D"],"answer":"A","question_key":"thinks it should help the local community","evidence_en":"Each town has many people in need","evidence_person":"A","hint_vi":"cho rằng nên giúp đỡ cộng đồng địa phương","trap":null,"paraphrase_relation":"thinks it should help the local community ↔ Each town has many people in need","passages_vi":{"A":"Một số người thích làm tình nguyện ở nước ngoài, nhưng thành thật mà nói, tôi cảm thấy hầu hết mọi người quan tâm đến việc đi du lịch hơn. Tôi tin rằng chúng ta nên sử dụng thời gian của mình một cách ý nghĩa hơn. Mỗi thị trấn đều có nhiều người cần giúp đỡ. Hoàn cảnh của họ rất khó khăn và họ không có phương tiện để cải thiện chất lượng cuộc sống. Họ là những cá nhân đã đóng góp rất nhiều cho đất nước. Chia sẻ những câu chuyện với họ giúp chúng ta hiểu được sự khác biệt giữa các thế hệ. Chúng ta cũng có thể mở rộng hiểu biết của mình về lịch sử, truyền thống và văn hóa địa phương thông qua những trải nghiệm của họ.","B":"Mẹ tôi bảo tôi làm tình nguyện tại địa phương vì bà là thành viên của tổ chức đó, nhưng tôi không thích điều đó. Tôi thích làm tình nguyện ở nước ngoài hơn vì tôi có thể phát triển các kỹ năng mềm — điều sẽ có lợi cho sự nghiệp tương lai của tôi. Ngoài ra, gặp gỡ những người mới giúp tôi mở rộng mạng lưới quan hệ và tạo ra những kết nối có giá trị mà tôi có thể sử d aragraph_1based":61,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":5,"public_app_question_id":4},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T05_Q05","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T05","topic_en":"6. VOLUNTEERING","topic_vi":"5. HOẠT ĐỘNG TÌNH NGUYỆN","question_no":5,"question_en":"Who thinks it can improve knowledge about culture?","question_vi":"Ai cho rằng nó có thể nâng cao hiểu biết về văn hóa?","options":["A","B","C","D"],"answer":"A","question_key":"thinks it can improve knowledge about culture","evidence_en":"broaden our knowledge about local history, traditions, and culture","evidence_person":"A","hint_vi":"cho rằng nó có thể nâng cao hiểu biết về văn hóa","trap":null,"paraphrase_relation":"thinks it can improve knowledge about culture ↔ broaden our knowledge about local history, traditions, and culture","passages_vi":{"A":"Một số người thích làm tình nguyện ở nước ngoài, nhưng thành thật mà nói, tôi cảm thấy hầu hết mọi người quan tâm đến việc đi du lịch hơn. Tôi tin rằng chúng ta nên sử dụng thời gian của mình một cách ý nghĩa hơn. Mỗi thị trấn đều có nhiều người cần giúp đỡ. Hoàn cảnh của họ rất khó khăn và họ không có phương tiện để cải thiện chất lượng cuộc sống. Họ là những cá nhân đã đóng góp rất nhiều cho đất nước. Chia sẻ những câu chuyện với họ giúp chúng ta hiểu được sự khác biệt giữa các thế hệ. Chúng ta cũng có thể mở rộng hiểu biết của mình về lịch sử, truyền thống và văn hóa địa phương thông qua những  between generations. We can also broaden our knowledge about local history, traditions, and culture through their experiences.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":62,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":5,"public_app_question_id":5},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T05_Q06","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T05","topic_en":"6. VOLUNTEERING","topic_vi":"5. HOẠT ĐỘNG TÌNH NGUYỆN","question_no":6,"question_en":"Who thinks it is a way to travel?","question_vi":"Ai cho rằng đó là một cách để đi du lịch?","options":["A","B","C","D"],"answer":"D","question_key":"thinks it is a way to travel","evidence_en":"a great way to travel","evidence_person":"D","hint_vi":"cho rằng đó là một cách để đi du lịch","trap":null,"paraphrase_relation":"thinks it is a way to travel ↔ a great way to travel","passages_vi":{"A":"Một số người thích làm tình nguyện ở nước ngoài, nhưng thành thật mà nói, tôi cảm thấy hầu hết mọi người quan tâm đến việc đi du lịch hơn. Tôi tin rằng chúng ta nên sử dụng thời gian của mình một cách ý nghĩa hơn. Mỗi thị trấn đều có nhiều người cần giúp đỡ. Hoàn cảnh của họ rất khó khăn và họ không có phương tiện để cải thiện chất lượng cuộc sống. Họ là những cá nhân đã đóng góp rất nhiều cho đất nước. Chia sẻ những câu chuyện với họ giúp chúng ta hiểu được sự khác biệt giữa các thế hệ. Chúng ta cũng có thể mở rộng hiểu biết của mình về lịch sử, truyền thống và văn hóa địa phương thông qua những trải nghiệm của họ.","B":"Mẹ tôi bảo tôi làm tình nguyện tại địa phương vì bà là thành viên của tổ chức đó, nhưng tôi không thích điều đó. Tôi thích làm tình nguyện ở nước ngoài hơn vì tôi có thể phát triển các kỹ năng mềm — điều sẽ có lợi cho sự nghiệp tương lai của tôi. Ngoài ra, gặp gỡ những người mới giúp tôi mở rộng mạng lưới quan hệ và tạo ra những kết nối có giá trị mà tôi có thể sử dụng sau này trong cuộc sống chuyên nghiệp của mình.","C":"Tôi quá bận rộn và hiếm khi có thời gian rảnh để làm bất cứ điều gì, vì vậy việc dành ra dù chỉ vài giờ để làm tình nguyện cũng rất khó khăn. Tôi sẽ phải nghỉ nửa ngày làm việc. Tôi thấy nhiều người đang gặp khó khăn và họ thực sự cần một số hỗ trợ tài chính thêm. Đó là điều tôi có thể giúp được vì tôi có mức lương tốt. Việc quyên góp hàng tháng không phải là vấn đề đối với tôi — đó là cách tôi thể hiện sự hỗ trợ và đóng góp của mình.","D":"Tôi tin rằng có nhiều cách để chúng ta thể hiện lòng tốt thông qua hoạt động tình nguyện. Bây giờ tôi đã nghỉ hưu và hiện đang giúp xây nhà cho những người có hoàn cảnh khó khăn. Tôi làm việc với một tổ chức tình nguyện đã có sẵn kế hoạch rõ ràng. Thông qua công việc này, tôi đã có cơ hội trải nghiệm các nền văn hóa nước ngoài khác nhau. Chúng tôi thường được cử đến nhiều quốc gia khác nhau để thực hiện các dự án này, vì vậy đây cũng là một cách tuyệt vời để đi du lịch trong khi làm điều gì đó có ý nghĩa. Công việc đòi hỏi lao động chân tay, vì vậy chúng tôi có thể cải thiện sức khỏe thể chất của mình — điều mà một số người chỉ bắt đầu nhận ra sau một thời gian."},"passage_en":"I believe there are many ways we can show kindness through volunteering. I'm retired now, and I currently help build houses for people in need. I work with a volunteering organisation that already has clear plans in place. Through this work, I've had the chance to experience different foreign cultures. We're often sent to various countries to carry out these projects, so it's also a great way to travel while doing something meaningful. The job involves manual labour, so we're able to improve our physical health — something that some people only begin to notice after a while.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":63,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":5,"public_app_question_id":6},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T05_Q07","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T05","topic_en":"6. VOLUNTEERING","topic_vi":"5. HOẠT ĐỘNG TÌNH NGUYỆN","question_no":7,"question_en":"Who wants to make new friends?","question_vi":"Ai muốn kết bạn mới?","options":["A","B","C","D"],"answer":"B","question_key":"wants to make new friends","evidence_en":"meeting new people helps me expand my network","evidence_person":"B","hint_vi":"muốn kết bạn mới","trap":null,"paraphrase_relation":"wants to make new friends ↔ meeting new people helps me expand my network","passages_vi":{"A":"Một số người thích làm tình nguyện ở nước ngoài, nhưng thành thật mà nói, tôi cảm thấy hầu hết mọi người quan tâm đến việc đi du lịch hơn. Tôi tin rằng chúng ta nên sử dụng thời gian của mình một cách ý nghĩa hơn. Mỗi thị trấn đều có nhiều người cần giúp đỡ. Hoàn cảnh của họ rất khó khăn và họ không có phương tiện để cải thiện chất lượng cuộc sống. Họ là những cá nhân đã đóng góp rất nhiều cho đất nước. Chia sẻ những câu chuyện với họ giúp chúng ta hiểu được sự khác biệt giữa các thế I can use later in my professional life.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":64,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":5,"public_app_question_id":7},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOURCE","evidence_in_passage":"PASS"},"content_status":"VERIFIED_CORE","exam_readiness":"EXAM_RENDERABLE_SOURCE_CONTENT"},{"id":"R4_T06_Q01","skill":"reading","part":4,"source_type":"teacher_material_plus_public_app","topic_id":"R4_T06","topic_en":"7. CAREER","topic_vi":"6. NGHỀ NGHIỆP","question_no":1,"question_en":"Who did not want to change to other careers?","question_vi":"Ai không muốn chuyển sang ngành nghề khác?","options":["A","B","C","D"],"answer":"B","question_key":"did not want to change to other careers","evidence_en":"there was no need to look at other careers","evidence_person":"B","hint_vi":"không muốn chuyển sang ngành nghề khác","trap":null,"paraphrase_relation":"did not want to change to other careers ↔ there was no need to look at other careers","passages_vi":{"A":"Khi tôi học xong, tôi không thực sự biết mình muốn làm gì. Một số người khuyên tôi nên đi làm ngay lập tức. Tuy nhiên, tôi thích tích lũy một số kinh nghiệm thực tế trước. Đó là lý do tại sao tôi đã ứng tuyển vào nhiều vị trí tình nguyện. Mặc dù tôi không kiếm được tiền, nhưng tôi đã có thể thử sức với nhiều loại công việc khác nhau. Nhìn lại, tôi hài lòng với quyết định của mình vì những kiến thức hữu ích mà tôi đã có được.","B":"Tôi học thẳng lên đại học sau khi tốt nghiệp cấp ba. Tôi luôn muốn trở thành giáo viên, vì vậy không cần phải tìm kiếm các ngành nghề khác. Ba tháng trước, tôi tham gia thực tập tại một trường học địa phương. Đó thực sự là một trải nghiệm mở mang tầm mắt, mặc dù khối lượng công việc nhiều hơn tôi nghĩ. Tuy nhiên, tôi tin rằng điều đó rất đáng giá.","C":"Khi còn nhỏ, tôi sống gần một người thợ sửa ống nước và thỉnh thoảng làm việc cùng cô ấy. Cô ấy nhờ tôi làm những công việc đơn giản như kiểm tra rò rỉ đường ống hoặc vặn ốc bằng tuốc-nơ-vít. Vì vậy, sau này, việc học đại học để trở thành thợ điện đối với tôi là điều tự nhiên. Bây giờ khi thấy có các khóa học điện ngắn hạn trực tuyến, tôi ước gì mình đã chọn cách đó thay vì học đại học.","D":"Sau khi học xong, tôi muốn có một khoảng thời gian để xác định xem mình thực sự muốn gì. Vì vậy, tôi bắt đầu tìm kiếm các công việc tạm thời. Tuy nhiên, rất khó để tìm được một công việc vì hầu hết các công ty không nhận những người chưa có kinh nghiệm. Cuối cùng, một công ty trò chơi đã liên hệ với tôi và tôi đồng ý làm việc với họ. Công việc là kết hợp (làm tại văn phòng và từ xa), vì vậy đôi khi tôi làm việc vào buổi tối, nhưng điều đó vẫn ổn đối với tôi."},"passage_en":"I went straight to university after I graduated from high school. I had always wanted to become a teacher, so there was no need to look at other careers. Three months ago, I joined an internship at a local school. It was really an eye-opening experience, although the workload was heavier than I thought. Still, I believe it was very worthwhile.","source_ref":{"teacher_file":"reading part 4(1).docx","teacher_question_paragraph_1based":71,"public_app_source":"https://raw.githubusercontent.com/hvqui/aptis-reading-part4/main/data.json","public_app_topic_id":6,"public_app_question_id":1},"verification":{"teacher_answer":"VERIFIED_FROM_TEACHER_DOC","app_answer":"VERIFIED_FROM_PUBLIC_APP_SOURCE","answer_crosscheck":"MATCH","evidence":"VERIFIED_FROM_APP_HIGHLIGHT","question_key":"DERIVED_FROM_SOURCE_QUESTION","hint_vi":"DERIVED_FROM_TEACHER_QUESTION","trap":"PENDING_AUTHORING","passage_en":"INGESTED_FROM_PUBLIC_APP_SOUR
