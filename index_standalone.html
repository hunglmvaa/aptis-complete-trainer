<script>window.DEFAULT_APTIS_DATA = {"schema_version":"3.2","pack_id":"APTIS_COMPLETE_V3_2","title":"APTIS Core Pack 01–02 + Reading · Canonical V1.2","created_date":"2026-09-21","canonical_source":"APTIS_DATA_CANONICAL_V1_2 + verified Reading master banks","voice_engine":"Web Speech API","provenance_policy":["SOURCE","SOURCE_INCOMPLETE","DERIVED_GUIDANCE","GENERATED_PRACTICE","SUPPLEMENTAL_EXTERNAL_SOURCE"],"sets":[{"set_id":"SET_01","title":"Listening Set 01","parts":{"L1":[{"id":"L1_Q001","source_ref":"L1_Q001","source_question_raw":"How much are the eggs?","source_options_raw":["1.25 pound.","1.50 pound","2 pounds."],"question_en":"How much are the eggs?","options":["1.25 pound.","1.50 pound","2 pounds."],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"How much are the eggs today? I thought they were one pound twenty-five last week."},{"speaker":"F","text":"They were, but the price has gone up. They are one pound fifty now. The organic eggs are two pounds."}],"key_vi":{"type":"SỐ / GIÁ / SỐ LƯỢNG","answer":"1.50 pound","hint":"trứng bao nhiêu tiền?","explanation":"Key cần nhớ: 1.50 pound. Hai lựa chọn “1.25 pound.” và “2 pounds.” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"They were, but the price has gone up. They are one pound fifty now. The organic eggs are two pounds."}},{"id":"L1_Q002","source_ref":"L1_Q002","source_question_raw":"What time does the train leave? (for him to go on a business trip)","source_options_raw":["9.45","8.45","9.15"],"question_en":"What time does the train leave? (for him to go on a business trip)","options":["9.45","8.45","9.15"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Which train are you taking for the business trip? The nine forty-five service?"},{"speaker":"M","text":"No, that gets in too late. I am taking the nine fifteen train. I considered the eight forty-five one, but I do not need to leave that early."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"9.15","hint":"tau chạy lúc may giờ (dé di công tác)","explanation":"Key cần nhớ: 9.15. Hai lựa chọn “9.45” và “8.45” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, that gets in too late. I am taking the nine fifteen train. I considered the eight forty-five one, but I do not need to leave that early."}},{"id":"L1_Q003","source_ref":"L1_Q003","source_question_raw":"How does she go to school?","source_options_raw":["She walks","She drives","She goes by bus."],"question_en":"How does she go to school?","options":["She walks","She drives","She goes by bus."],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Do you still take the bus to school?"},{"speaker":"F","text":"Not anymore. My dad sometimes drives me when it rains, but I usually walk because the school is quite close."}],"key_vi":{"type":"PHƯƠNG TIỆN / CÁCH DI CHUYỂN","answer":"She walks","hint":"cô ay đi phương tiện gì đến trường?","explanation":"Key cần nhớ: She walks. Hai lựa chọn “She drives” và “She goes by bus.” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Not anymore. My dad sometimes drives me when it rains, but I usually walk because the school is quite close."}},{"id":"L1_Q004","source_ref":"L1_Q004","source_question_raw":"A woman is calling her husband. What time is lunch ready?","source_options_raw":["lpm","2pm","3pm."],"question_en":"A woman is calling her husband. What time is lunch ready?","options":["1pm","2pm","3pm."],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Lunch will not be ready at one because my meeting finished late."},{"speaker":"M","text":"What time should I come home then?"},{"speaker":"F","text":"Come at two. Everything will be ready by then. Three would be much too late."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"2pm","hint":"may giờ có bữa trưa?","explanation":"Key cần nhớ: 2pm. Hai lựa chọn “1pm” và “3pm.” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Come at two. Everything will be ready by then. Three would be much too late."}},{"id":"L1_Q005","source_ref":"L1_Q005","source_question_raw":"What does she usually do in the evening?","source_options_raw":["listen to music","go for a walk","go to the coffee shop"],"question_en":"What does she usually do in the evening?","options":["listen to music","go for a walk","go to the coffee shop"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Do you normally listen to music after dinner?"},{"speaker":"F","text":"Sometimes, but I usually go for a walk in the evening. I only go to the coffee shop at weekends."}],"key_vi":{"type":"HOẠT ĐỘNG / THÓI QUEN","answer":"go for a walk","hint":"Cô ấy thường làm gì vào buỗi tối?","explanation":"Key cần nhớ: go for a walk. Hai lựa chọn “listen to music” và “go to the coffee shop” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Sometimes, but I usually go for a walk in the evening. I only go to the coffee shop at weekends."}},{"id":"L1_Q006","source_ref":"L1_Q006","source_question_raw":"Where will they meet?","source_options_raw":["at the university","at the station","at the park"],"question_en":"Where will they meet?","options":["at the university","at the station","at the park"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Shall we meet at the station after class?"},{"speaker":"M","text":"It will be very crowded there. The university closes early today, so let us meet at the park entrance instead."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"at the park","hint":"2 người hen gặp nhau ở đâu?","explanation":"Key cần nhớ: at the park. Hai lựa chọn “at the university” và “at the station” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"It will be very crowded there. The university closes early today, so let us meet at the park entrance instead."}},{"id":"L1_Q007","source_ref":"L1_Q007","source_question_raw":"What does this family do most weekends?","source_options_raw":["goes with their friends","goes bowling","goes for a walk"],"question_en":"What does this family do most weekends?","options":["goes with their friends","goes bowling","goes for a walk"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Does your family go bowling every weekend?"},{"speaker":"F","text":"No, only occasionally. We see friends sometimes, but most weekends we go for a long walk together."}],"key_vi":{"type":"HOẠT ĐỘNG / THÓI QUEN","answer":"goes for a walk","hint":"gia đình này thường làm gì vào các cuối tuần?","explanation":"Key cần nhớ: goes for a walk. Hai lựa chọn “goes with their friends” và “goes bowling” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, only occasionally. We see friends sometimes, but most weekends we go for a long walk together."}},{"id":"L1_Q008","source_ref":"L1_Q008","source_question_raw":"What day do they meet?","source_options_raw":["Tuesday","Thursday","Friday"],"question_en":"What day do they meet?","options":["Tuesday","Thursday","Friday"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Can we meet on Thursday?"},{"speaker":"M","text":"I have my club on Thursday, and Friday is already full. Tuesday would work best for me."},{"speaker":"F","text":"Tuesday it is."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"Tuesday","hint":"thir may gap nhau?","explanation":"Key cần nhớ: Tuesday. Hai lựa chọn “Thursday” và “Friday” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Tuesday it is."}},{"id":"L1_Q009","source_ref":"L1_Q009","source_question_raw":"What career did he choose?","source_options_raw":["to work in business","to be a teacher","to keep studying"],"question_en":"What career did he choose?","options":["to work in business","to be a teacher","to keep studying"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"I once thought about becoming a teacher, and I also considered studying for a few more years."},{"speaker":"F","text":"So what did you finally decide to do?"},{"speaker":"M","text":"I chose to work in business, and I am happy with that decision."}],"key_vi":{"type":"CÔNG VIỆC / HỌC TẬP","answer":"to work in business","hint":"nghệ nghiệp mà anh ấy đã chọn?","explanation":"Key cần nhớ: to work in business. Hai lựa chọn “to be a teacher” và “to keep studying” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"I chose to work in business, and I am happy with that decision."}},{"id":"L1_Q010","source_ref":"L1_Q010","source_question_raw":"What course did he take?","source_options_raw":["Management","Computer","Leadership"],"question_en":"What course did he take?","options":["Management","Computer","Leadership"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Did you take the management course last term?"},{"speaker":"M","text":"No. I looked at management and leadership, but the course I actually took was computer studies."}],"key_vi":{"type":"CÔNG VIỆC / HỌC TẬP","answer":"Computer","hint":"anh ay tham gia khéa hoc gi?","explanation":"Key cần nhớ: Computer. Hai lựa chọn “Management” và “Leadership” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No. I looked at management and leadership, but the course I actually took was computer studies."}},{"id":"L1_Q011","source_ref":"L1_Q011","source_question_raw":"A woman is talking about her job. How is being a writer different from other","source_options_raw":["She works irregular time","She does not have a high salary","She has no fixed workplace"],"question_en":"A woman is talking about her job. How is being a writer different from other jobs?","options":["She works irregular time","She does not have a high salary","She has no fixed workplace"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Do you enjoy being a writer?"},{"speaker":"F","text":"Yes, although my schedule is very different from most office jobs. Some days I work early, other days I work late, so my working hours are quite irregular."}],"key_vi":{"type":"CÔNG VIỆC / HỌC TẬP","answer":"She works irregular time","hint":"làm nhà văn thì có gi khác với các nghề khác?","explanation":"Key cần nhớ: She works irregular time. Hai lựa chọn “She does not have a high salary” và “She has no fixed workplace” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Yes, although my schedule is very different from most office jobs. Some days I work early, other days I work late, so my working hours are quite irregular."}},{"id":"L1_Q012","source_ref":"L1_Q012","source_question_raw":"Where does she buy food?","source_options_raw":["at a local market","at a convenient store","at a new shopping centre"],"question_en":"Where does she buy food?","options":["at a local market","at a convenient store","at a new shopping centre"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Do you still buy vegetables at the local market?"},{"speaker":"F","text":"Not usually. There is a new shopping centre near my house and I buy most of my food there now. The convenience store is only for emergencies."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"at a new shopping centre","hint":"cô ta mua đồ ăn ở đâu?","explanation":"Key cần nhớ: at a new shopping centre. Hai lựa chọn “at a local market” và “at a convenient store” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Not usually. There is a new shopping centre near my house and I buy most of my food there now. The convenience store is only for emergencies."}},{"id":"L1_Q013","source_ref":"L1_Q013","source_question_raw":"What causes air pollution?","source_options_raw":["Fire from the countryside","Pollutants from private cars","Smoke from factories"],"question_en":"What causes air pollution?","options":["Fire from the countryside","Pollutants from private cars","Smoke from factories"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"People usually blame traffic and factory smoke for the dirty air."},{"speaker":"M","text":"They do, but this week the biggest problem has been smoke from fires in the countryside. The wind has carried it into the city."}],"key_vi":{"type":"LÝ DO / NGUYÊN NHÂN","answer":"Fire from the countryside","hint":"điều gi gây 6 nhiễm không khí?","explanation":"Key cần nhớ: Fire from the countryside. Hai lựa chọn “Pollutants from private cars” và “Smoke from factories” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"They do, but this week the biggest problem has been smoke from fires in the countryside. The wind has carried it into the city."}},{"id":"L1_Q014","source_ref":"L1_Q014","source_question_raw":"'What time đo they meet?","source_options_raw":["7.30pm","6.30pm","9.30pm"],"question_en":"What time đo they meet?","options":["7.30pm","6.30pm","9.30pm"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Shall we meet at seven thirty?"},{"speaker":"F","text":"That is a little late for me. Six thirty is better. I definitely cannot wait until nine thirty."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"6.30pm","hint":"Họ gặp nhau lúc may giờ?","explanation":"Key cần nhớ: 6.30pm. Hai lựa chọn “7.30pm” và “9.30pm” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"That is a little late for me. Six thirty is better. I definitely cannot wait until nine thirty."}},{"id":"L1_Q015","source_ref":"L1_Q015","source_question_raw":"What time does she meet her child?","source_options_raw":["Seven o’clock","Three o'clock","Two o'clock"],"question_en":"What time does she meet her child?","options":["Seven o’clock","Three o'clock","Two o'clock"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"I need to collect my child after school."},{"speaker":"M","text":"At two o clock?"},{"speaker":"F","text":"No, school finishes later. I will meet her at three. Seven would obviously be far too late."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"Three o'clock","hint":"Cô ta gap con. hic may gio?","explanation":"Key cần nhớ: Three o'clock. Hai lựa chọn “Seven o’clock” và “Two o'clock” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, school finishes later. I will meet her at three. Seven would obviously be far too late."}},{"id":"L1_Q016","source_ref":"L1_Q016","source_question_raw":"What does her sister drink?","source_options_raw":["Water","Tea","Coffee"],"question_en":"What does her sister drink?","options":["Water","Tea","Coffee"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Does your sister drink coffee in the morning?"},{"speaker":"F","text":"No, she does not like coffee. She sometimes has water, but she normally drinks tea with breakfast."}],"key_vi":{"type":"ĐỒ VẬT / ĐỒ ĂN / NỘI DUNG","answer":"Tea","hint":"chị gái cô ấy uống gì?","explanation":"Key cần nhớ: Tea. Hai lựa chọn “Water” và “Coffee” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, she does not like coffee. She sometimes has water, but she normally drinks tea with breakfast."}},{"id":"L1_Q017","source_ref":"L1_Q017","source_question_raw":"How many buildings will the town have?","source_options_raw":["1000","2000","3000"],"question_en":"How many buildings will the town have?","options":["1000","2000","3000"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"The original plan was for one thousand new buildings."},{"speaker":"M","text":"Has that changed?"},{"speaker":"F","text":"Yes. The town has approved two thousand. Three thousand was discussed but rejected."}],"key_vi":{"type":"SỐ / GIÁ / SỐ LƯỢNG","answer":"2000","hint":"Thị tran sẽ xây bao nhiêu tòa nha?","explanation":"Key cần nhớ: 2000. Hai lựa chọn “1000” và “3000” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Yes. The town has approved two thousand. Three thousand was discussed but rejected."}},{"id":"L1_Q018","source_ref":"L1_Q018","source_question_raw":"What does she usually do on Saturdays?","source_options_raw":["plays sports","goes to the park","sees her family"],"question_en":"What does she usually do on Saturdays?","options":["plays sports","goes to the park","sees her family"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Do you play sports on Saturdays?"},{"speaker":"F","text":"Not very often. I sometimes go to the park, but I usually spend Saturdays visiting my family."}],"key_vi":{"type":"HOẠT ĐỘNG / THÓI QUEN","answer":"sees her family","hint":"Cô ấy làm gì vào các ngày thứ bay?","explanation":"Key cần nhớ: sees her family. Hai lựa chọn “plays sports” và “goes to the park” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Not very often. I sometimes go to the park, but I usually spend Saturdays visiting my family."}},{"id":"L1_Q019","source_ref":"L1_Q019","source_question_raw":"'What đo they both buy?","source_options_raw":["Books","Trousers","Clothes"],"question_en":"What do they both buy?","options":["Books","Trousers","Clothes"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"I bought some books, but Tom did not."},{"speaker":"M","text":"Did you both get trousers?"},{"speaker":"F","text":"Not exactly. We chose different things, but we both bought clothes."}],"key_vi":{"type":"ĐỒ VẬT / ĐỒ ĂN / NỘI DUNG","answer":"Clothes","hint":"2 người cùng mua gì?","explanation":"Key cần nhớ: Clothes. Hai lựa chọn “Books” và “Trousers” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Not exactly. We chose different things, but we both bought clothes."}},{"id":"L1_Q020","source_ref":"L1_Q020","source_question_raw":"What color shirt did he buy?","source_options_raw":["Blue","Black","Red"],"question_en":"What color shirt did he buy?","options":["Blue","Black","Red"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Did you buy the blue shirt?"},{"speaker":"F","text":"No, I liked it but they did not have my size. The red one was too bright, so I bought the black shirt."}],"key_vi":{"type":"MÔ TẢ","answer":"Black","hint":"Anh ta đã mua áo sơ mi mau gì?","explanation":"Key cần nhớ: Black. Hai lựa chọn “Blue” và “Red” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, I liked it but they did not have my size. The red one was too bright, so I bought the black shirt."}},{"id":"L1_Q021","source_ref":"L1_Q021","source_question_raw":"When is the assignment due?","source_options_raw":["on Friday","on Saturday","on Thursday"],"question_en":"When is the assignment due?","options":["on Friday","on Saturday","on Thursday"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Is the assignment due on Friday?"},{"speaker":"M","text":"No, the lecturer gave us one more day. We have to submit it on Saturday. Thursday was only the original date."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"on Saturday","hint":"Hạn nộp bài tập là thứ may?","explanation":"Key cần nhớ: on Saturday. Hai lựa chọn “on Friday” và “on Thursday” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, the lecturer gave us one more day. We have to submit it on Saturday. Thursday was only the original date."}},{"id":"L1_Q022","source_ref":"L1_Q022","source_question_raw":"What did the professor want her to do?","source_options_raw":["Do research","Make a report","Speak at the conference"],"question_en":"What did the professor want her to do?","options":["Do research","Make a report","Speak at the conference"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Did the professor ask you to do more research?"},{"speaker":"F","text":"That was my first thought, but no. He wants me to speak at the conference. The report can wait until later."}],"key_vi":{"type":"CÔNG VIỆC / HỌC TẬP","answer":"Speak at the conference","hint":"Thay giao muốn cô ấy làm gì?","explanation":"Key cần nhớ: Speak at the conference. Hai lựa chọn “Do research” và “Make a report” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"That was my first thought, but no. He wants me to speak at the conference. The report can wait until later."}},{"id":"L1_Q023","source_ref":"L1_Q023","source_question_raw":"Where did she choose to go on holiday?","source_options_raw":["The south","The park","The mountain"],"question_en":"Where did she choose to go on holiday?","options":["The south","The park","The mountain"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"For the holiday I considered going to the mountains."},{"speaker":"M","text":"And the park near the lake?"},{"speaker":"F","text":"Only for a day trip. For the actual holiday I have chosen the south."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"The south","hint":"cô ấy chon di đâu cho ky nghỉ?","explanation":"Key cần nhớ: The south. Hai lựa chọn “The park” và “The mountain” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Only for a day trip. For the actual holiday I have chosen the south."}},{"id":"L1_Q024","source_ref":"L1_Q024","source_question_raw":"What is special about the new song?","source_options_raw":["The singer’s voice","The words","The tune"],"question_en":"What is special about the new song?","options":["The singer’s voice","The words","The tune"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"What do you think makes the new song different? The singer voice?"},{"speaker":"F","text":"Her voice is good and the tune is catchy, but the words are what really make the song special."}],"key_vi":{"type":"Ý KIẾN / ĐIỂM NỔI BẬT","answer":"The words","hint":"Điều gì dac biệt ở bài hat mới?","explanation":"Key cần nhớ: The words. Hai lựa chọn “The singer’s voice” và “The tune” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Her voice is good and the tune is catchy, but the words are what really make the song special."}}],"L2":{"topic_id":"L2_T01","title":"PROTECT THE ENVIRONMENT","title_vi":"BẢO VỆ MÔI TRƯỜNG","provenance":{"transcripts":"SOURCE","answers":"SOURCE","extra_distractors":"GENERATED_PRACTICE"},"options":["Using less electricity","Not driving to work","Shopping online","Using less water","Using more electricity at home","Driving alone more often"],"speakers":[{"id":"L2_T01_SA","speaker":"A","script_text":"\"I try to help the environment by using less electricity at home. I always turn off the lights when I don't need them and make sure my appliances are energy-efficient. I've also started unplugging things like chargers when I'm not using them because they still use power. This helps lower my electricity bill and reduces my impact on the planet. I believe that if everyone made these small changes, we could save a lot of energy and help fight climate change.\"","answer":"Using less electricity","key_vi":{"answer":"Sử dụng ít điện hơn","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"by using less electricity at home · turn off the lights · appliances · energy-efficient · chargers · use power"}},{"id":"L2_T01_SB","speaker":"B","script_text":"\"To protect the environment, I don't drive to work anymore. Instead, I walk when the weather is nice, or I take the bus. It's not only better for the planet, but it also keeps me more active, and I enjoy the fresh air. By not driving, I use less fuel and help reduce air pollution in the city. I think if more people chose to walk or use public transport, we could reduce traffic and make our towns and cities cleaner and healthier for everyone.\"","answer":"Not driving to work","key_vi":{"answer":"Không lái xe đi làm","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"don't drive to work · anymore · take the bus · By not driving · public transport · reduce traffic"}},{"id":"L2_T01_SC","speaker":"C","script_text":"\"I've decided to shop online as a way to protect the environment. By ordering things online, I don't need to drive to the store, which means I'm using less fuel and producing less pollution. Many companies now offer eco-friendly packaging, and I try to buy from them whenever possible. Also, online deliveries often group items together, which reduces the number of trips made. It's convenient for me, and I feel like I'm doing something good for the environment at the same time.\"","answer":"Shopping online","key_vi":{"answer":"Mua sắm trực tuyến","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"shop online · ordering things online · online deliveries"}},{"id":"L2_T01_SD","speaker":"D","script_text":"\"I try to save water every day as a way to protect the environment. For example, I take shorter showers, turn off the tap while brushing my teeth, and use less water when washing dishes. I've also installed special taps and showerheads that use less water but still work well. Water is a limited resource, and many places don't have enough clean water. That's why I think it's important for all of us to be careful and not waste it. Even small actions can make a big difference.\"","answer":"Using less water","key_vi":{"answer":"Sử dụng ít nước hơn","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"save water · use less water · clean water"}}]},"L3":{"topic_id":"L3_T01","title":"Changes in workplace","title_vi":"Những thay đổi tại nơi làm việc","provenance":{"statements":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_segments":[{"speaker":"M","text":"We've both been thinking about changes in workplace, and I suspect we won't agree on every detail."},{"speaker":"F","text":"Probably not. It helps to separate the individual claims, because our opinions can change from one point to the next."},{"speaker":"M","text":"For me, continuity really matters. I've seen enough examples to feel quite strongly about that."},{"speaker":"F","text":"I see the point, but I wouldn't go that far. I think there are too many exceptions for me to agree completely."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I take a clearer position: job security can't be guaranteed. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'd say job satisfaction is an important motivator. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"For me, technology is good for the economy. I've seen enough examples to feel quite strongly about that."},{"speaker":"F","text":"I see the point, but I wouldn't go that far. I think there are too many exceptions for me to agree completely."},{"speaker":"M","text":"What makes this kind of discussion difficult is that sharing the same topic doesn't mean sharing the same judgement."},{"speaker":"F","text":"Exactly. A listener has to track who actually supports each idea, and whether the other speaker agrees, qualifies it, or rejects it."},{"speaker":"M","text":"Another thing I notice in discussions like this is that the same vocabulary can support different opinions. One person may mention the same problem as the other but use it to reach a different conclusion. That is why listening only for repeated nouns is risky; the important information is often in the verb, the evaluation, or the contrast that follows."},{"speaker":"F","text":"Yes, and agreement is not always expressed with the word 'agree'. Sometimes a speaker restates the idea positively, gives a supporting example, or says that something matches their own experience. Disagreement can also be indirect: a speaker may say 'perhaps', 'not always', or 'it depends', which weakens the claim rather than rejecting every part of it."},{"speaker":"M","text":"So during practice I would keep the four statements visible and make a quick mark only after each opinion becomes clear. If a speaker changes direction, the later qualified position should matter more than the first reaction."},{"speaker":"F","text":"And after the audio ends, it is worth checking the pattern across all four statements. The aim is not to force a remembered code onto the conversation, but to use the code only as a memory check after the evidence has been heard."}],"statements":[{"id":"L3_T01_Q01","no":1,"text":"Continuity is important","answer":"M","key_vi":{"statement_vi":"Sự liên tục là quan trọng","answer_text":"Man","code_digit":"1"}},{"id":"L3_T01_Q02","no":2,"text":"Job security cannot be guaranteed","answer":"W","key_vi":{"statement_vi":"Sự ổn định công việc không thể được đảm bảo","answer_text":"Woman","code_digit":"2"}},{"id":"L3_T01_Q03","no":3,"text":"Job satisfaction is an important motivator","answer":"B","key_vi":{"statement_vi":"Sự hài lòng trong công việc là một động lực quan trọng","answer_text":"Both","code_digit":"0"}},{"id":"L3_T01_Q04","no":4,"text":"Technology is good for the economy","answer":"M","key_vi":{"statement_vi":"Công nghệ tốt cho nền kinh tế","answer_text":"Man","code_digit":"1"}}],"canonical_code":"1201"},"L4":{"topic_id":"L4_T01","title":"A BREAK FROM STUDYING","title_vi":"Tạm nghỉ học","provenance":{"questions":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_text":"When I finished school, most of my friends wanted to go straight to university. I was different. I had good grades, but I did not feel ready to start higher education. I was not sure what subject I wanted to study, and I felt that beginning a degree immediately would have been the wrong decision. So I took a year away from studying. I worked in a small hotel, saved money, and later travelled on my own. At home I had always depended on my parents for practical things, but while I was away I had to plan my budget, book transport, cook for myself, and solve problems alone. By the end of the year, I had become much more independent. I also understood what I wanted from university. Taking a break helped me return with a clearer purpose and much more confidence.","questions":[{"id":"L4_T01_Q01","no":1,"options":["He wasn't ready to start higher education","He was eager to begin university immediately.","He felt completely prepared for higher education."],"answer_index":0,"key_vi":{"answer":"Anh ấy chưa sẵn sàng để bắt đầu học đại học","explanation":"Chọn ý tóm tắt đúng kết luận của người nói; các phương án còn lại là ý gần chủ đề nhưng không phải kết luận chính.","evidence_en":"I did not feel ready to start higher education."}},{"id":"L4_T01_Q02","no":2,"options":["How to be more independent","How to depend more on other people.","How to avoid making independent choices."],"answer_index":0,"key_vi":{"answer":"Cách để trở nên tự lập hơn","explanation":"Chọn ý tóm tắt đúng kết luận của người nói; các phương án còn lại là ý gần chủ đề nhưng không phải kết luận chính.","evidence_en":"By the end of the year, I had become much more independent."}}]}},"reading_refs":{"R1":"R1_S01","R23":"R23_T01","R4":"R4_T01","R5":"R5_T01"}},{"set_id":"SET_02","title":"Listening Set 02","parts":{"L1":[{"id":"L1_Q025","source_ref":"L1_Q025","source_question_raw":"What did she like the most about the movie?","source_options_raw":["the car scenes","the fight scenes","the mountain scenes"],"question_en":"What did she like the most about the movie?","options":["the car scenes","the fight scenes","the mountain scenes"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"What was your favourite part of the movie? The car scenes?"},{"speaker":"F","text":"They were exciting, and the fight scenes were well done, but I loved the mountain scenes most. They looked amazing on the big screen."}],"key_vi":{"type":"Ý KIẾN / ĐIỂM NỔI BẬT","answer":"the mountain scenes","hint":"Điêu gì cô ấy thích nhất ở bộ phim?","explanation":"Key cần nhớ: the mountain scenes. Hai lựa chọn “the car scenes” và “the fight scenes” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"They were exciting, and the fight scenes were well done, but I loved the mountain scenes most. They looked amazing on the big screen."}},{"id":"L1_Q026","source_ref":"L1_Q026","source_question_raw":"Why did she become a scientist?","source_options_raw":["a large stone","her dream","her favorite collection"],"question_en":"Why did she become a scientist?","options":["a large stone","her dream","her favorite collection"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"When did you first become interested in science?"},{"speaker":"M","text":"It was not because of a childhood dream. I found a large unusual stone when I was young, and that made me want to understand how it was formed."}],"key_vi":{"type":"LÝ DO / NGUYÊN NHÂN","answer":"a large stone","hint":"Động lực gì khiến cô ấy nghiên cứu khoa học?","explanation":"Key cần nhớ: a large stone. Hai lựa chọn “her dream” và “her favorite collection” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"It was not because of a childhood dream. I found a large unusual stone when I was young, and that made me want to understand how it was formed."}},{"id":"L1_Q027","source_ref":"L1_Q027","source_question_raw":"What time will they meet?","source_options_raw":["Half past eight","Quarter to seven","Quarter to eight"],"question_en":"What time will they meet?","options":["Half past eight","Quarter to seven","Quarter to eight"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Can we meet at half past eight?"},{"speaker":"F","text":"That is too late. Quarter to seven is difficult for me too. Let us make it quarter to eight."},{"speaker":"M","text":"Perfect."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"Quarter to eight","hint":"2 người hen nhau lúc may gio?","explanation":"Key cần nhớ: Quarter to eight. Hai lựa chọn “Half past eight” và “Quarter to seven” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"That is too late. Quarter to seven is difficult for me too. Let us make it quarter to eight."}},{"id":"L1_Q028","source_ref":"L1_Q028","source_question_raw":"Where did they meet for the bus home?","source_options_raw":["hotel entrance","bus station","marketplace"],"question_en":"Where did they meet for the bus home?","options":["hotel entrance","bus station","marketplace"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Where did everyone gather for the bus home? At the hotel entrance?"},{"speaker":"M","text":"No, the driver asked us to meet in the marketplace. We passed the bus station on the way, but we did not meet there."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"marketplace","hint":"Hẹn gặp nhau để di bus về nha?","explanation":"Key cần nhớ: marketplace. Hai lựa chọn “hotel entrance” và “bus station” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, the driver asked us to meet in the marketplace. We passed the bus station on the way, but we did not meet there."}},{"id":"L1_Q029","source_ref":"L1_Q029","source_question_raw":"How old is Stephanie?","source_options_raw":["21","23","24"],"question_en":"How old is Stephanie?","options":["21","23","24"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Is Stephanie twenty-three?"},{"speaker":"F","text":"No, she is younger than that. She is twenty-one. Her sister is twenty-four."}],"key_vi":{"type":"SỐ / GIÁ / SỐ LƯỢNG","answer":"21","hint":"Stephanie bao nhiêu tuổi? (đây là một cô gái ứng tuyển cho vị trí cô","explanation":"Key cần nhớ: 21. Hai lựa chọn “23” và “24” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, she is younger than that. She is twenty-one. Her sister is twenty-four."}},{"id":"L1_Q030","source_ref":"L1_Q030","source_question_raw":"Where is the club near?","source_options_raw":["A park","A library","A coffee shop"],"question_en":"Where is the club near?","options":["A park","A library","A coffee shop"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"The club is easy to find. It is not near the library or the coffee shop."},{"speaker":"M","text":"So what is beside it?"},{"speaker":"F","text":"A large park. The entrance is directly opposite the park gates."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"A park","hint":"câu lạc bộ ở gần đâu?","explanation":"Key cần nhớ: A park. Hai lựa chọn “A library” và “A coffee shop” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"A large park. The entrance is directly opposite the park gates."}},{"id":"L1_Q031","source_ref":"L1_Q031","source_question_raw":"What to feed the cat?","source_options_raw":["Milk","Fish","Cat food"],"question_en":"What should they feed the cat?","options":["Milk","Fish","Cat food"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Should I give the cat some milk?"},{"speaker":"F","text":"No, please do not. Give it some fish. We have cat food too, but it will not eat that brand."}],"key_vi":{"type":"ĐỒ VẬT / ĐỒ ĂN / NỘI DUNG","answer":"Fish","hint":"Cho mèo ăn gi?","explanation":"Key cần nhớ: Fish. Hai lựa chọn “Milk” và “Cat food” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, please do not. Give it some fish. We have cat food too, but it will not eat that brand."}},{"id":"L1_Q032","source_ref":"L1_Q032","source_question_raw":"What does this family do most weekends?","source_options_raw":["goes with their friends","goes bowling","goes for a walk"],"question_en":"What does this family do most weekends?","options":["goes with their friends","goes bowling","goes for a walk"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"We do not go bowling very often, and we only see our friends once or twice a month."},{"speaker":"M","text":"So what do you do most weekends?"},{"speaker":"F","text":"We usually go for a walk together."}],"key_vi":{"type":"HOẠT ĐỘNG / THÓI QUEN","answer":"goes for a walk","hint":"gia đình nay làm gì hau hết cuối tuần?","explanation":"Key cần nhớ: goes for a walk. Hai lựa chọn “goes with their friends” và “goes bowling” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"We usually go for a walk together."}},{"id":"L1_Q033","source_ref":"L1_Q033","source_question_raw":"What does he need to buy for his sister?","source_options_raw":["Chocolates","Eggs","Milk"],"question_en":"What does he need to buy for his sister?","options":["Chocolates","Eggs","Milk"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"I need to get something for my sister. Does she need eggs or milk?"},{"speaker":"F","text":"No, she already bought groceries. Get her some chocolates; they are her favourite."}],"key_vi":{"type":"ĐỒ VẬT / ĐỒ ĂN / NỘI DUNG","answer":"Chocolates","hint":"Anh ta mua gì cho chị gai?","explanation":"Key cần nhớ: Chocolates. Hai lựa chọn “Eggs” và “Milk” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, she already bought groceries. Get her some chocolates; they are her favourite."}},{"id":"L1_Q034","source_ref":"L1_Q034","source_question_raw":"The train was delayed. What time does the train leave?","source_options_raw":["8.45","9.15","9.30"],"question_en":"The train was delayed. What time does the train leave?","options":["8.45","9.15","9.30"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"My train was supposed to leave at eight forty-five."},{"speaker":"M","text":"But it is delayed, right?"},{"speaker":"F","text":"Yes. They first moved it to nine fifteen, and now the board says nine thirty."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"9.30","hint":"Tau bi delay, tau chạy lúc may giờ?","explanation":"Key cần nhớ: 9.30. Hai lựa chọn “8.45” và “9.15” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Yes. They first moved it to nine fifteen, and now the board says nine thirty."}},{"id":"L1_Q035","source_ref":"L1_Q035","source_question_raw":"Which area has the best weather?","source_options_raw":["In the south","In the east","In the west"],"question_en":"Which area has the best weather?","options":["In the south","In the east","In the west"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"I heard the south is warm this week."},{"speaker":"F","text":"It is, but the weather forecast says the east will have the best conditions overall. The west will be much wetter."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"In the east","hint":"thời tiết ở đâu đẹp nhất?","explanation":"Key cần nhớ: In the east. Hai lựa chọn “In the south” và “In the west” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"It is, but the weather forecast says the east will have the best conditions overall. The west will be much wetter."}},{"id":"L1_Q036","source_ref":"L1_Q036","source_question_raw":"'Why was the museum visit cancelled?","source_options_raw":["Join other activities","Poor weather conditions","Not enough people"],"question_en":"Why was the museum visit cancelled?","options":["Join other activities","Poor weather conditions","Not enough people"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"I thought the museum trip was cancelled because of the rain."},{"speaker":"M","text":"No, the weather was fine. The problem was that not enough people registered, so the visit had to be cancelled."}],"key_vi":{"type":"LÝ DO / NGUYÊN NHÂN","answer":"Not enough people","hint":"tại sao phải huỷ chuyến thăm bảo tang?","explanation":"Key cần nhớ: Not enough people. Hai lựa chọn “Join other activities” và “Poor weather conditions” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, the weather was fine. The problem was that not enough people registered, so the visit had to be cancelled."}},{"id":"L1_Q037","source_ref":"L1_Q037","source_question_raw":"Where is the cafe?","source_options_raw":["Next to the station","Near the gift shop","Opposite the gift shop"],"question_en":"Where is the cafe?","options":["Next to the station","Near the gift shop","Opposite the gift shop"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Is the cafe beside the station?"},{"speaker":"F","text":"No. Walk past the station and the gift shop. The cafe is directly opposite the gift shop."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"Opposite the gift shop","hint":"quan cafe ở đâu?","explanation":"Key cần nhớ: Opposite the gift shop. Hai lựa chọn “Next to the station” và “Near the gift shop” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No. Walk past the station and the gift shop. The cafe is directly opposite the gift shop."}},{"id":"L1_Q039","source_ref":"L1_Q039","source_question_raw":"Which room is the largest in her house?","source_options_raw":["Living room","Bedroom","Kitchen"],"question_en":"Which room is the largest in her house?","options":["Living room","Bedroom","Kitchen"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Your living room looks huge."},{"speaker":"F","text":"It is comfortable, but the kitchen is actually the largest room in the house. The bedroom is the smallest."}],"key_vi":{"type":"ĐỊA ĐIỂM","answer":"Kitchen","hint":"phòng nao to nhat trong nhà cô ta?","explanation":"Key cần nhớ: Kitchen. Hai lựa chọn “Living room” và “Bedroom” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"It is comfortable, but the kitchen is actually the largest room in the house. The bedroom is the smallest."}},{"id":"L1_Q040","source_ref":"L1_Q040","source_question_raw":"What time is the meeting?","source_options_raw":["9.15","10.15","10.30"],"question_en":"What time is the meeting?","options":["9.15","10.15","10.30"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Is the meeting at nine fifteen?"},{"speaker":"M","text":"No, it starts at ten fifteen. Ten thirty is when the next session begins."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"10.15","hint":"Budi họp lúc may giờ?","explanation":"Key cần nhớ: 10.15. Hai lựa chọn “9.15” và “10.30” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, it starts at ten fifteen. Ten thirty is when the next session begins."}},{"id":"L1_Q041","source_ref":"L1_Q041","source_question_raw":"Why did he call his friend?","source_options_raw":["To make an appointment","To say hello","Suggest a drink"],"question_en":"Why did he call his friend?","options":["To make an appointment","To say hello","Suggest a drink"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Why did you phone Daniel? Was it just to say hello?"},{"speaker":"M","text":"No, I wanted to suggest going for a drink after work. We can arrange the appointment another day."}],"key_vi":{"type":"LÝ DO / NGUYÊN NHÂN","answer":"Suggest a drink","hint":"Tai sao anh ay goi dién cho ban anh ta?","explanation":"Key cần nhớ: Suggest a drink. Hai lựa chọn “To make an appointment” và “To say hello” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, I wanted to suggest going for a drink after work. We can arrange the appointment another day."}},{"id":"L1_Q042","source_ref":"L1_Q042","source_question_raw":"How does he feel?","source_options_raw":["Sick","Sad","Well"],"question_en":"How does he feel?","options":["Sick","Sad","Well"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"You do not look very well today."},{"speaker":"F","text":"I am not. I feel sick, so I am going home early. I am not sad, just unwell."}],"key_vi":{"type":"Ý KIẾN / ĐIỂM NỔI BẬT","answer":"Sick","hint":"- Anh ay cam thay như thé nào?","explanation":"Key cần nhớ: Sick. Hai lựa chọn “Sad” và “Well” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"I am not. I feel sick, so I am going home early. I am not sad, just unwell."}},{"id":"L1_Q043","source_ref":"L1_Q043","source_question_raw":"What is the mother asking her daughter to buy?","source_options_raw":["eggs","chocolates","bread"],"question_en":"What is the mother asking her daughter to buy?","options":["eggs","chocolates","bread"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Could you stop at the shop on your way home?"},{"speaker":"M","text":"Sure. Do we need bread or chocolates?"},{"speaker":"F","text":"Neither. Please buy some eggs; we have run out."}],"key_vi":{"type":"ĐỒ VẬT / ĐỒ ĂN / NỘI DUNG","answer":"eggs","hint":"Me gọi con gái nhờ mua gì?","explanation":"Key cần nhớ: eggs. Hai lựa chọn “chocolates” và “bread” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Neither. Please buy some eggs; we have run out."}},{"id":"L1_Q044","source_ref":"L1_Q044","source_question_raw":"When do they meet?","source_options_raw":["8.00","9.00","10.00"],"question_en":"When do they meet?","options":["8.00","9.00","10.00"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Are we meeting at eight?"},{"speaker":"F","text":"I cannot get there that early. Nine is possible, but ten works best for everyone."},{"speaker":"M","text":"Okay, ten o clock."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"10.00","hint":"Hen nhau lúc mấy giờ?","explanation":"Key cần nhớ: 10.00. Hai lựa chọn “8.00” và “9.00” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Okay, ten o clock."}},{"id":"L1_Q045","source_ref":"L1_Q045","source_question_raw":"Why can't she pick up her child?","source_options_raw":["meet her client","have an urgent meeting","stay late at the office"],"question_en":"Why can't she pick up her child?","options":["meet her client","have an urgent meeting","stay late at the office"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"Can you pick up your child after school today?"},{"speaker":"F","text":"I am afraid not. I do not have a client meeting, but I have to stay late at the office. There is a lot of work to finish."}],"key_vi":{"type":"LÝ DO / NGUYÊN NHÂN","answer":"stay late at the office","hint":"Tại sao cô ấy không thé đón con được?","explanation":"Key cần nhớ: stay late at the office. Hai lựa chọn “meet her client” và “have an urgent meeting” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"I am afraid not. I do not have a client meeting, but I have to stay late at the office. There is a lot of work to finish."}},{"id":"L1_Q046","source_ref":"L1_Q046","source_question_raw":"What movie does she recommend?","source_options_raw":["comedy film","action film","horror film"],"question_en":"What movie does she recommend?","options":["comedy film","action film","horror film"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"I want to watch a film tonight. Maybe a comedy?"},{"speaker":"M","text":"The comedy is not very good. I would recommend the action film. The horror film is too predictable."}],"key_vi":{"type":"ĐỒ VẬT / ĐỒ ĂN / NỘI DUNG","answer":"action film","hint":"Cô ay khuyên nên xem phim gì?","explanation":"Key cần nhớ: action film. Hai lựa chọn “comedy film” và “horror film” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"The comedy is not very good. I would recommend the action film. The horror film is too predictable."}},{"id":"L1_Q048","source_ref":"L1_Q048","source_question_raw":"What means of transport does he use to get to work?","source_options_raw":["by bus","by train","by car"],"question_en":"What means of transport does he use to get to work?","options":["by bus","by train","by car"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"How do you usually get to work? Do you drive?"},{"speaker":"M","text":"No, parking is too expensive. I sometimes take the train, but I normally go by bus."}],"key_vi":{"type":"PHƯƠNG TIỆN / CÁCH DI CHUYỂN","answer":"by bus","hint":"Đi làm bang phương tiện gi?","explanation":"Key cần nhớ: by bus. Hai lựa chọn “by train” và “by car” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No, parking is too expensive. I sometimes take the train, but I normally go by bus."}},{"id":"L1_Q049","source_ref":"L1_Q049","source_question_raw":"What time do experts recommend eating fruit?","source_options_raw":["in the morning","in the afternoon","in the evening"],"question_en":"What time do experts recommend eating fruit?","options":["in the morning","in the afternoon","in the evening"],"answer_index":0,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"When should I eat fruit? I usually have it in the evening."},{"speaker":"F","text":"Nutrition experts often recommend having fruit in the morning. The afternoon is fine too, but morning is their first choice."}],"key_vi":{"type":"THỜI GIAN / NGÀY","answer":"in the morning","hint":"Chuyên gia khuyên nên ăn hoa quả vào budi nao?","explanation":"Key cần nhớ: in the morning. Hai lựa chọn “in the afternoon” và “in the evening” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"Nutrition experts often recommend having fruit in the morning. The afternoon is fine too, but morning is their first choice."}},{"id":"L1_Q050","source_ref":"L1_Q050","source_question_raw":"Why does she wake up early?","source_options_raw":["to exercise","to have some quiet time","to do housework"],"question_en":"Why does she wake up early?","options":["to exercise","to have some quiet time","to do housework"],"answer_index":1,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"F","text":"Why do you get up so early? Is it to exercise?"},{"speaker":"M","text":"No. I like having some quiet time before everyone else wakes up. I do housework later in the day."}],"key_vi":{"type":"LÝ DO / NGUYÊN NHÂN","answer":"to have some quiet time","hint":"Tại sao cô ta đậy sớm?","explanation":"Key cần nhớ: to have some quiet time. Hai lựa chọn “to exercise” và “to do housework” xuất hiện như thông tin phụ/phương án bị loại.","evidence_en":"No. I like having some quiet time before everyone else wakes up. I do housework later in the day."}}],"L2":{"topic_id":"L2_T02","title":"ONLINE SHOPPING","title_vi":"MUA SẮM TRỰC TUYẾN","provenance":{"transcripts":"SOURCE","answers":"SOURCE","extra_distractors":"GENERATED_PRACTICE"},"options":["The products are delivered","It is cheaper","It saves time","There are more choices","Speaking directly to shop assistants","Paying only with cash"],"speakers":[{"id":"L2_T02_SA","speaker":"A","script_text":"\"The biggest advantage of shopping online for me is the fact that I don't have to leave my house. I love how products get delivered straight to my doorstep, especially when I order something heavy or large. It saves me the hassle of carrying things back from the store. I also like how fast the delivery can be, sometimes arriving the very next day. It makes life so much easier, especially when I have a busy week ahead and can't make it to the shops.\"","answer":"The products are delivered","key_vi":{"answer":"Sản phẩm được giao đến","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"I don't have to leave my house · products get delivered straight · I also like how fast the delivery"}},{"id":"L2_T02_SB","speaker":"B","script_text":"\"For me, one of the main reasons I shop online is because it's usually more affordable. I've noticed that many online stores offer discounts and I can often find cheaper prices than I would in physical shops. Plus, I can compare products easily, making sure I'm getting the best deal. I also don't have to spend money on transportation or parking, which adds up in the long run. It's a great way to stick to my budget while still getting everything I need.\"","answer":"It is cheaper","key_vi":{"answer":"Nó rẻ hơn","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"more affordable · offer discounts · cheaper prices · making sure I'm getting the best deal"}},{"id":"L2_T02_SC","speaker":"C","script_text":"\"I've always been a bit short on time, especially with my busy work schedule. That's why I prefer shopping online. It really helps me save so much time. Instead of spending hours in stores, I can quickly browse through different websites, compare prices, and make my purchase in just a few clicks. It's so convenient, especially when I need something urgently. I can even shop during my lunch break or late at night. It fits perfectly with my lifestyle, and I don't have to worry about rushing to a store before it closes.\"","answer":"It saves time","key_vi":{"answer":"Nó tiết kiệm thời gian","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"I've always been a bit short on time · work schedule · helps me save so much time · I can quickly browse"}},{"id":"L2_T02_SD","speaker":"D","script_text":"\"What I love about shopping online is the incredible variety of products available. When I go to a store, I'm limited to what's in stock, but online, there's so much more choice. I can find different brands, styles, and even products that aren't available locally. It's great for finding unique items or hard-to-find sizes. I can spend time browsing until I find exactly what I'm looking for without feeling rushed. It gives me the freedom to explore all my options.\"","answer":"There are more choices","key_vi":{"answer":"Có nhiều lựa chọn hơn","explanation":"Nghe ý chính của speaker và đối chiếu paraphrase; không chọn chỉ vì một từ giống đáp án.","evidence_en":"When I go to a store · limited · more choice · my options"}}]},"L3":{"topic_id":"L3_T02","title":"Beauty","title_vi":"Sắc đẹp","provenance":{"statements":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_segments":[{"speaker":"F","text":"Probably not. It helps to separate the individual claims, because our opinions can change from one point to the next."},{"speaker":"M","text":"We've both been thinking about beauty, and I suspect we won't agree on every detail."},{"speaker":"F","text":"I see the point, but I wouldn't go that far. I think there are too many exceptions for me to agree completely."},{"speaker":"M","text":"For me, people share similar ideas about beauty. I've seen enough examples to feel quite strongly about that."},{"speaker":"F","text":"I take a clearer position: ideas about beauty change over time. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"I'd say beauty may be found in unlikely places. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I take a clearer position: traditional ideas of beauty are going to change. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"M","text":"What makes this kind of discussion difficult is that sharing the same topic doesn't mean sharing the same judgement."},{"speaker":"F","text":"Exactly. A listener has to track who actually supports each idea, and whether the other speaker agrees, qualifies it, or rejects it."},{"speaker":"M","text":"Another thing I notice in discussions like this is that the same vocabulary can support different opinions. One person may mention the same problem as the other but use it to reach a different conclusion. That is why listening only for repeated nouns is risky; the important information is often in the verb, the evaluation, or the contrast that follows."},{"speaker":"F","text":"Yes, and agreement is not always expressed with the word 'agree'. Sometimes a speaker restates the idea positively, gives a supporting example, or says that something matches their own experience. Disagreement can also be indirect: a speaker may say 'perhaps', 'not always', or 'it depends', which weakens the claim rather than rejecting every part of it."},{"speaker":"M","text":"So during practice I would keep the four statements visible and make a quick mark only after each opinion becomes clear. If a speaker changes direction, the later qualified position should matter more than the first reaction."},{"speaker":"F","text":"And after the audio ends, it is worth checking the pattern across all four statements. The aim is not to force a remembered code onto the conversation, but to use the code only as a memory check after the evidence has been heard."}],"statements":[{"id":"L3_T02_Q01","no":1,"text":"People share similar ideas about beauty","answer":"M","key_vi":{"statement_vi":"Mọi người có những quan điểm tương tự nhau về vẻ đẹp","answer_text":"Man","code_digit":"1"}},{"id":"L3_T02_Q02","no":2,"text":"Ideas about beauty change over time","answer":"W","key_vi":{"statement_vi":"Các quan điểm về vẻ đẹp thay đổi theo thời gian","answer_text":"Woman","code_digit":"2"}},{"id":"L3_T02_Q03","no":3,"text":"Beauty can be found in unlikely places","answer":"B","key_vi":{"statement_vi":"Vẻ đẹp có thể được tìm thấy ở những nơi khó ngờ tới","answer_text":"Both","code_digit":"0"}},{"id":"L3_T02_Q04","no":4,"text":"Traditional ideas of beauty are going to change","answer":"W","key_vi":{"statement_vi":"Những quan niệm truyền thống về vẻ đẹp sẽ thay đổi","answer_text":"Woman","code_digit":"2"}}],"canonical_code":"1202"},"L4":{"topic_id":"L4_T02","title":"THE LIFE OF A SCIENTIST","title_vi":"Cuộc đời của một nhà khoa học","provenance":{"questions":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_text":"I have just finished a new book about the life of a well-known scientist, and I was surprised by how easy it was to read. The writer discusses some difficult scientific ideas, but instead of filling every page with technical language, he explains them in simple terms and uses everyday examples. The book includes parts of the scientist personal life, but that is not its main purpose. What interested me most was how this book compares with the author earlier biography. I expected a completely different interpretation, but the overall picture is actually quite similar to the previous book. There are some new stories and updated details, yet the writer main view remains consistent. For readers who found the earlier book interesting but demanding, this version may be easier to follow because of its clear language.","questions":[{"id":"L4_T02_Q01","no":1,"options":["It uses simple language to describe complex ideas","It focuses mainly on the scientist's personal life.","It gives a detailed explanation of every experiment."],"answer_index":0,"key_vi":{"answer":"Nó sử dụng ngôn ngữ đơn giản để mô tả những ý tưởng phức tạp","explanation":"Chọn ý tóm tắt đúng kết luận của người nói; các phương án còn lại là ý gần chủ đề nhưng không phải kết luận chính.","evidence_en":"he explains them in simple terms"}},{"id":"L4_T02_Q02","no":2,"options":["It is similar to the previous book about the scientist","It presents a completely different view of the scientist.","It contains fewer details than his earlier biography."],"answer_index":0,"key_vi":{"answer":"Nó tương tự với cuốn sách trước đây về nhà khoa học đó","explanation":"Chọn ý tóm tắt đúng kết luận của người nói; các phương án còn lại là ý gần chủ đề nhưng không phải kết luận chính.","evidence_en":"the overall picture is actually quite similar to the previous book"}}]}},"reading_refs":{"R1":"R1_S02","R23":"R23_T02","R4":"R4_T02","R5":"R5_T02"}}],"reading_bank":{"R1":{"schema_version":"1.6","stage":"Stage 7 - Reading Part 1 cloze bank","created_date":"2026-09-20","sources":[{"type":"teacher_scan_pdf","file":"Reading part 1.pdf","role":"Primary source: 17 cloze se
