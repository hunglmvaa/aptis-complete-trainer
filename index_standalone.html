l's main entrance","By the hotel's main entrance"],"question_en":"Where do they wait for the bus?","options":["Next to the hotel","Near the hotel's main entrance","By the hotel's main entrance"],"answer_index":2,"provenance":{"question":"SOURCE","options":"SOURCE_CLEAN_DISPLAY","answer":"SOURCE","script":"GENERATED_PRACTICE"},"script_type":"dialogue","script_segments":[{"speaker":"M","text":"I nearly chose Next to the hotel."},{"speaker":"F","text":"I can see why, because it came up in the conversation. But after the correction, the answer is By the hotel's main entrance."},{"speaker":"M","text":"So Near the hotel's main entrance and Next to the hotel are both distractors, and By the hotel's main entrance is the detail I need."}],"key_vi":{"type":"ĐỊA ĐIỂM / KHU VỰC / PHÒNG / TẦNG","answer":"By the hotel's main entrance","hint":"liệi nhau ở đâu dé di xe bus?","explanation":"Trước hết xác định loại thông tin cần nghe: PLACE / LOCATION. Sau đó loại các phương án không khớp ngữ cảnh và giữ chi tiết cuối cùng/được xác nhận.","evidence_en":"By the hotel's main entrance"}}],"L2":{"topic_id":"L2_T05","title":"ENVIRONMENT PROBLEM","title_vi":"VẤN ĐỀ MÔI TRƯỜNG","provenance":{"transcripts":"SOURCE","answers":"SOURCE","extra_distractors":"GENERATED_PRACTICE"},"options":["Give away used items","Buy environmentally friendly products","Reuse containers for storing food","Does not use commercial cleaning products","Throw away used containers","Use stronger chemical cleaners"],"speakers":[{"id":"L2_T05_SA","speaker":"A","script_text":"\"You know, it amazes me how much we throw away without thinking. I've started giving away my old clothes and furniture instead of dumping them. Think about it-someone else could really use what we consider junk. It's such a simple thing, but it keeps stuff out of landfills and helps people out. The more we share, the less we waste. Why let things rot in a corner when they could have a second life somewhere else? It makes me feel like I'm doing my part, even in small ways. Plus, it's a good reminder that what's old to me could be new to someone else.\"","answer":"Give away used items","key_vi":{"answer":"Cho/tặng những đồ vật đã qua sử dụng","explanation":"Đáp án mục tiêu là “Give away used items”. Trong transcript, ý này được diễn đạt bằng các phrase throw away, giving away my, old, clothes. Khi nghe không chờ đúng nguyên văn đáp án; hãy nhận ra cụm đồng nghĩa/paraphrase.","evidence_en":"\"You know, it amazes me how much we throw away without thinking."}},{"id":"L2_T05_SB","speaker":"B","script_text":"\"I think one of the biggest ways we can protect the environment is by changing what we buy. I only purchase products that are sustainably sourced or made from recycled materials. Every dollar we spend is like casting a vote for the kind of world we want. It's crazy how much waste and pollution come from manufacturing—choosing eco-friendly products is a way to push back against that. Sure, it might cost a bit more sometimes, but isn't the planet worth it? I mean, we talk a lot about big changes, but if everyone just started small, like switching to biodegradable packaging, we'd see a massive impact.\"","answer":"Buy environmentally friendly products","key_vi":{"answer":"Mua các sản phẩm thân thiện với môi trường","explanation":"Đáp án mục tiêu là “Buy environmentally friendly products”. Trong transcript, ý này được diễn đạt bằng các phrase we buy, only purchase, made from, recycled. Khi nghe không chờ đúng nguyên văn đáp án; hãy nhận ra cụm đồng nghĩa/paraphrase.","evidence_en":"\"I think one of the biggest ways we can protect the environment is by changing what we buy."}},{"id":"L2_T05_SC","speaker":"C","script_text":"\"I've started reusing containers for storing food. I was tired of buying plastic wrap and bags every month, just to toss them after one use. You don't realize how much waste you produce until you try cutting it down. Now, I use glass jars and old containers to store leftovers, and it works just as well. Honestly, it makes me feel a little less guilty about all the plastic in my life. I'm not saying I'm perfect, but even this small habit makes a difference. And let's be real-who needs more clutter in the kitchen, anyway?\"","answer":"Reuse containers for storing food","key_vi":{"answer":"Tái sử dụng hộp đựng để bảo quản thực phẩm","explanation":"Đáp án mục tiêu là “Reuse containers for storing food”. Trong transcript, ý này được diễn đạt bằng các phrase reusing, containers, for storing food, Now, I use glass jars and old. Khi nghe không chờ đúng nguyên văn đáp án; hãy nhận ra cụm đồng nghĩa/paraphrase.","evidence_en":"\"I've started reusing containers for storing food."}},{"id":"L2_T05_SD","speaker":"D","script_text":"\"I stopped buying commercial cleaning products altogether. Most of them are filled with harsh chemicals that are terrible for the environment-and probably for us, too. Now, I make my own cleaning solutions. Vinegar, baking soda, and a little lemon juice can handle pretty much anything around the house. It's cheaper, safer, and I don't feel like I'm dumping toxins down the drain every time I clean. People think it's hard, but honestly, once you try it, it's not that bad. We don't need a cabinet full of chemicals to keep things tidy. Nature's got it covered.\"","answer":"Does not use commercial cleaning products","key_vi":{"answer":"Không sử dụng các sản phẩm tẩy rửa thương mại","explanation":"Đáp án mục tiêu là “Does not use commercial cleaning products”. Trong transcript, ý này được diễn đạt bằng các phrase stopped, commercial cleaning products, baking soda, tidy. Khi nghe không chờ đúng nguyên văn đáp án; hãy nhận ra cụm đồng nghĩa/paraphrase.","evidence_en":"\"I stopped buying commercial cleaning products altogether."}}]},"L3":{"topic_id":"L3_T05","title":"Two Actors","title_vi":"Hai diễn viên","provenance":{"statements":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_segments":[{"speaker":"M","text":"We've both been thinking about two actors, and I suspect we won't agree on every detail."},{"speaker":"F","text":"Probably not. It helps to separate the individual claims, because our opinions can change from one point to the next."},{"speaker":"M","text":"For me, auditions are the most important of casting. I've seen enough examples to feel quite strongly about that."},{"speaker":"F","text":"I see the point, but I wouldn't go that far. I think there are too many exceptions for me to agree completely."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I take a clearer position: actors respond best to a strong script. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'd say theatre acting and movie acting require different skills. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"I'd say actors need to be praised. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"What makes this kind of discussion difficult is that sharing the same topic doesn't mean sharing the same judgement."},{"speaker":"F","text":"Exactly. A listener has to track who actually supports each idea, and whether the other speaker agrees, qualifies it, or rejects it."},{"speaker":"M","text":"Another thing I notice in discussions like this is that the same vocabulary can support different opinions. One person may mention the same problem as the other but use it to reach a different conclusion. That is why listening only for repeated nouns is risky; the important information is often in the verb, the evaluation, or the contrast that follows."},{"speaker":"F","text":"Yes, and agreement is not always expressed with the word 'agree'. Sometimes a speaker restates the idea positively, gives a supporting example, or says that something matches their own experience. Disagreement can also be indirect: a speaker may say 'perhaps', 'not always', or 'it depends', which weakens the claim rather than rejecting every part of it."},{"speaker":"M","text":"So during practice I would keep the four statements visible and make a quick mark only after each opinion becomes clear. If a speaker changes direction, the later qualified position should matter more than the first reaction."},{"speaker":"F","text":"And after the audio ends, it is worth checking the pattern across all four statements. The aim is not to force a remembered code onto the conversation, but to use the code only as a memory check after the evidence has been heard."}],"statements":[{"id":"L3_T05_Q01","no":1,"text":"Auditions are the most important of casting","answer":"M","key_vi":{"statement_vi":"Các buổi thử vai là phần quan trọng nhất trong quá trình tuyển chọn diễn viên","answer_text":"Man","code_digit":"1"}},{"id":"L3_T05_Q02","no":2,"text":"Actors respond best to a strong script","answer":"W","key_vi":{"statement_vi":"Diễn viên phản ứng tốt nhất với một kịch bản mạnh","answer_text":"Woman","code_digit":"2"}},{"id":"L3_T05_Q03","no":3,"text":"Theatre acting and movie acting require different skills","answer":"B","key_vi":{"statement_vi":"Diễn xuất sân khấu và diễn xuất điện ảnh đòi hỏi những kỹ năng khác nhau","answer_text":"Both","code_digit":"0"}},{"id":"L3_T05_Q04","no":4,"text":"Actors need to be praised","answer":"B","key_vi":{"statement_vi":"Diễn viên cần được khen ngợi","answer_text":"Both","code_digit":"0"}}],"canonical_code":"1200"},"L4":{"topic_id":"L4_T05","title":"2 FAMOUS WRITERS","title_vi":"Hai nhà văn nổi tiếng","provenance":{"questions":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_text":"People often have quick opinions about 2 famous writers, but my experience has been more complicated. At first I expected the most obvious explanation to be right, and I even considered the idea that they have always received considerable academic attention. Another possibility people often mention is that their works are mainly studied in universities. After looking at the situation more carefully, neither description really matched what happened. The better summary is that things were ignored. That difference matters because the speaker's final judgement is more qualified than the tempting alternatives. There is another aspect that is easy to miss. Some people argue that their works are easy for everyone to interpret, while others go almost to the opposite extreme and say that the ideas in their books are explained very directly. My own view sits elsewhere. What matters is significance. In other words, the conclusion depends on the exact conditions being discussed, not on a broad slogan. During the discussion I might use several words related to the wrong choices, because they are realistic possibilities. That does not make them the answer. The key is to notice when an idea is introduced only to be limited, corrected, or rejected. Expressions such as “however”, “in practice”, “actually”, and “what matters more” often signal that the speaker is moving toward the real position. For a listening task, I would therefore avoid selecting an option as soon as I hear familiar vocabulary. I would wait until the evaluation becomes clear, then match that meaning to the option that paraphrases it most accurately. The two ideas to retain from this talk are the ones expressed through ignored, academics and significance, difficult to determine; they represent the settled view rather than the rejected alternatives. A longer talk also includes background that may not directly answer either question. For example, a speaker may describe how the issue developed, mention another person's view, or give a small personal example before returning to the main judgement. Those details are useful context, but they should not replace the two target conclusions. When I practise, I try to separate background information from evaluation language. Background tells me what happened; evaluation tells me what the speaker finally thinks about it. I also listen for changes in certainty. Words such as 'probably', 'only', 'not always', 'unlikely', and 'depends' can completely change which option is accurate. If two answers share similar vocabulary, the safer choice is the one that matches the strength and direction of the speaker's final judgement.","questions":[{"id":"L4_T05_Q01","no":1,"options":["They have both been overlooked by academics","They have always received considerable academic attention.","Their works are mainly studied in universities."],"answer_index":0,"key_vi":{"answer":"Cả hai người đều đã bị các học giả bỏ qua / không được giới học thuật chú ý đúng mức","explanation":"Nhận diện topic “2 FAMOUS WRITERS”, sau đó nhớ ý chính “They have both been overlooked by academics”. Các cụm paraphrase nguồn giúp nhận diện: overlooked → ignored | scholars → academics | not given attention → neglected.","evidence_en":"ignored"}},{"id":"L4_T05_Q02","no":2,"options":["The meanings of their works are not always easy to be identified","Their works are easy for everyone to interpret.","The ideas in their books are explained very directly."],"answer_index":0,"key_vi":{"answer":"Ý nghĩa trong các tác phẩm của họ không phải lúc nào cũng dễ xác định","explanation":"Nhận diện topic “2 FAMOUS WRITERS”, sau đó nhớ ý chính “The meanings of their works are not always easy to be identified”. Các cụm paraphrase nguồn giúp nhận diện: meaning → significance | not easy to identify → difficult to determine | unclear → hard to interpret.","evidence_en":"significance"}}]}}},{"set_id":"SET_06","title":"Listening Set 06 · Outdoor Activities, Technology & Regional Development","parts":{"L1":[{"id":"L1_Q127","source_ref":"L1_Q127","source_ iting. Riding through open fields or along forest paths is an amazing way to stay active. It's not just a workout, but also a chance to connect with animals and nature. I try to go riding whenever I have a free weekend—it's definitely my favorite way to keep fit.\"","answer":"Horse riding","key_vi":{"answer":"Cưỡi ngựa","explanation":"Đáp án mục tiêu là “Horse riding”. Trong transcript, ý này được diễn đạt bằng các phrase but, horse riding, horses, Riding. Khi nghe không chờ đúng nguyên văn đáp án; hãy nhận ra cụm đồng nghĩa/paraphrase.","evidence_en":"\"I've been involved in different sports over the years, but one thing that stands out for me is horse riding."}},{"id":"L2_T06_SB","speaker":"B","script_text":"\"I used to love mountain biking, enjoying the thrill of riding down steep slopes. It was really an amazing and adventurous feeling. However, after an injury from a fall, I became haunted by the fear of crashing and now I'm scared of this sport. But I still love the mountains, so I've decided to just go hiking every weekend instead.\"","answer":"Climbing","key_vi":{"answer":"Leo núi / leo trèo","explanation":"Đáp án mục tiêu là “Climbing”. Trong transcript, ý này được diễn đạt bằng các phrase However, love the mountains, so I've decided to just go hiking every weekend instead. Khi nghe không chờ đúng nguyên văn đáp án; hãy nhận ra cụm đồng nghĩa/paraphrase.","evidence_en":"However, after an injury from a fall, I became haunted by the fear of crashing and now I'm scared of this sport."}},{"id":"L2_T06_SC","speaker":"C","script_text":"\"I've always been drawn to outdoor activities, especially those that get my heart racing. While some of my friends prefer running or hiking, I find nothing more exciting than mountain biking. I love the challenge of rough terrains and feeling the wind rush by as I go downhill. It's also a great way to explore nature and stay fit. I try to hit the trails at least a few times a month because it's such a thrilling experience for me. I wouldn't go that far. I think there are too many exceptions for me to agree completely."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I take a clearer position: technology revolution is good for the economy. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'm not fully convinced by that. In my experience the situation is more mixed, so I would be careful about making such a general claim."},{"speaker":"F","text":"I take a clearer position: no computer is superior to the human brain. That's the interpretation that makes most sense to me."},{"speaker":"M","text":"I'd say increasingly ought to be done to protect individual privacy. That seems a fair conclusion from what we've been discussing."},{"speaker":"F","text":"I agree with that. My reasons are slightly different, but I reach the same conclusion."},{"speaker":"M","text":"What makes this kind of discussion difficult is that sharing the same topic doesn't mean sharing the same judgement."},{"speaker":"F","text":"Exactly. A listener has to track who actually supports each idea, and whether the other speaker agrees, qualifies it, or rejects it."},{"speaker":"M","text":"Another thing I notice in discussions like this is that the same vocabulary can support different opinions. One person may mention the same problem as the other but use it to reach a different conclusion. That is why listening only for repeated nouns is risky; the important information is often in the verb, the evaluation, or the contrast that follows."},{"speaker":"F","text":"Yes, and agreement is not always expressed with the word 'agree'. Sometimes a speaker restates the idea positively, gives a supporting example, or says that something matches their own experience. Disagreement can also be indirect: a speaker may say 'perhaps', 'not always', or 'it depends', which weakens the claim rather than rejecting every part of it."},{"speaker":"M","text":"So during practice I would keep the four statements visible and make a quick mark only after each opinion becomes clear. If a speaker changes direction, the later qualified position should matter more than the first reaction."},{"speaker":"F","text":"And after the audio ends, it is worth checking the pattern across all four statements. The aim is not to force a remembered code onto the conversation, but to use the code only as a memory check after the evidence has been heard."}],"statements":[{"id":"L3_T06_Q01","no":1,"text":"Future generations fail to cope with technology information","answer":"M","key_vi":{"statement_vi":"Các thế hệ tương lai không thể thích ứng tốt với thông tin công nghệ","answer_text":"Man","code_digit":"1"}},{"id":"L3_T06_Q02","no":2,"text":"Technology revolution is good for the economy","answer":"W","key_vi":{"statement_vi":"Cuộc cách mạng công nghệ tốt cho nền kinh tế","answer_text":"Woman","code_digit":"2"}},{"id":"L3_T06_Q03","no":3,"text":"No computer is superior to the human brain","answer":"W","key_vi":{"statement_vi":"Không có máy tính nào vượt trội hơn bộ não con người","answer_text":"Woman","code_digit":"2"}},{"id":"L3_T06_Q04","no":4,"text":"More should be done to protect individual privacy","answer":"B","key_vi":{"statement_vi":"Cần làm nhiều hơn để bảo vệ quyền riêng tư cá nhân","answer_text":"Both","code_digit":"0"}}],"canonical_code":"1220"},"L4":{"topic_id":"L4_T06","title":"REGIONAL DEVELOPMENT PLAN","title_vi":"Kế hoạch phát triển khu vực","provenance":{"questions":"SOURCE","answers":"SOURCE","script":"GENERATED_PRACTICE"},"script_text":"People often have quick opinions about regional development plan, but my experience has been more complicated. At first I expected the most obvious explanation to be right, and I even considered the idea that it provides many more alternatives to driving. Another possibility people often mention is that it strongly encourages people to stop using private cars. After looking at the situation more carefully, neither description really matched what happened. The better summary is that things were insufficient effort. That difference matters because the speaker's final judgement is more qualified than the tempting alternatives. There is another aspect that is easy to miss. Some people argue that the plan makes excellent use of all available land, while others go almost to the opposite extreme and say that most existing land is being used in the most efficient way. My own view sits elsewhere. What matters is available land. In other words, the conclusion depends on the exact conditions being discussed, not on a broad slogan. During the discussion I might use several words related to the wrong choices, because they are realistic possibilities. That does not make them the answer. The key is to notice when an idea is introduced only to be limited, corrected, or rejected. Expressions such as “however”, “in practice”, “actually”, and “what matters more” often signal that the speaker is moving toward the real position. For a listening task, I would therefore avoid selecting an option as soon as I hear familiar vocabulary. I would wait until the evaluation becomes clear, then match that meaning to the option that paraphrases it most accurately. The two ideas to retain from this talk are the ones expressed through insufficient effort, promote and available land, made good use of; they represent the settled view rather than the rejected alternatives. A longer talk also includes background that may not directly answer either question. For example, a speaker may describe how the issue developed, mention another person's view, or give a small personal example before returning to the main judgement. Those details are useful context, but they should not replace the two target conclusions. When I practise, I try to separate background information from evaluation language. Background tells me what happened; evaluation tells me what the speaker finally thinks about it. I also listen for changes in certainty. Words such as 'probably', 'only', 'not always', 'unlikely', and 'depends' can completely change which option is accurate. If two answers share similar vocabulary, the safer choice is the one that matches the strength and direction of the speaker's final judgement.","questions":[{"id":"L4_T06_Q01","no":1,"options":["It doesn't do enough to promote alternatives to driving","It provides many more alternatives to driving.","It strongly encourages people to stop using private cars."],"answer_index":0,"key_vi":{"answer":"Nó chưa làm đủ để thúc đẩy các lựa chọn thay thế cho việc lái xe","explanation":"Nhận diện topic “REGIONAL DEVELOPMENT PLAN”, sau đó nhớ ý chính “It doesn't do enough to promote alternatives to driving”. Các cụm paraphrase nguồn giúp nhận diện: not done enough → insufficient effort | encourage → promote | alternatives to driving → other ways of travelling.","evidence_en":"insufficient effort"}},{"id":"L4_T06_Q02","no":2,"options":["The plan is not making efficient use of existing land","The plan makes excellent use of all available land.","Most existing land is being used in the most efficient way."],"answer_index":0,"key_vi":{"answer":"Kế hoạch này chưa sử dụng hiệu quả quỹ đất hiện có","explanation":"Nhận diện topic “REGIONAL DEVELOPMENT PLAN”, sau đó nhớ ý chính “The plan is not making efficient use of existing land”. Các cụm paraphrase nguồn giúp nhận diện: existing land → available land | used effectively → made good use of | not used well → inefficiently used.","evidence_en":"available land"}}]}}}],"pack_version":"1.0.0","min_app_version":"3.3","__pack_source":"bundled","__pack_version":"1.0.0"}];

const STORE={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const APP_VERSION="3.3", USER_PK="aptis_v33_user_packs", ONLINE_PK="aptis_v33_online_cache", LEGACY_PK="aptis_v32_packs", SK="aptis_v32_state", VK="aptis_v32_voice";

if(!onlinePacks.length&&Array.isArray(window.BUNDLED_ONLINE_PACKS))onlinePacks=window.BUNDLED_ONLINE_PACKS.map(p=>tagPack(p,"bundled",p.__pack_version||p.pack_version||""));

async function refreshOnlinePacks(force=false,silent=false){
  if(location.protocol==="file:"){onlineStatus={state:"idle",message:"Chế độ file:// dùng pack bundled. Muốn đồng bộ manifest GitHub, hãy dùng START_LOCAL_SERVER.bat hoặc GitHub Pages.",manifest:onlineStatus.manifest||"",updated_at:onlineStatus.updated_at||""};rebuildPacks();if(state.view==="packs")renderPacks();return false;}
  onlineStatus={state:"loading",message:"Đang kiểm tra pack trên GitHub…",manifest:onlineStatus.manifest||"",updated_at:onlineStatus.updated_at||""};
  if(state.view==="packs")renderPacks();
  try{
    const suffix=force?`?t=${Date.now()}`:"";
    const mr=await fetch(`packs/pack_manifest.json${suffix}`,{cache:force?"no-store":"no-cache"});
    if(!mr.ok)throw new Error(`Không tải được manifest (${mr.status}).`);
    const manifest=await mr.json();
    if(!Array.isArray(manifest.packs))throw new Error("Manifest không có packs[].");
    const previous=new Map(onlinePacks.map(p=>[p.pack_id,p])),loaded=[],errors=[];
    for(const e of manifest.packs.filter(x=>x.enabled!==false)){
      try{
        const sep=String(e.file).includes("?")?"&":"?",v=e.version?`${sep}v=${encodeURIComponent(e.version)}`:"";
        const r=await fetch(`packs/${e.file}${v}`,{cache:force?"no-store":"default"});
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        const raw=validatePack(await r.json());
        if(e.pack_id&&raw.pack_id!==e.pack_id)throw new Error(`pack_id không khớp manifest: ${e.pack_id}`);
        loaded.push(tagPack(raw,"online",e.version||raw.pack_version||""));
      }catch(err){
        const old=previous.get(e.pack_id);if(old)loaded.push(tagPack(old,"online-cache",e.version||old.__pack_version||""));
        errors.push(`${e.pack_id||e.file}: ${err.message}`);
      }

    if(!loaded.length&&manifest.packs.some(x=>x.enabled!==false))throw new Error(errors.join("; ")||"Không tải được pack online.");
    onlinePacks=loaded;
    const now=new Date().toISOString();
    STORE.set(ONLINE_PK,JSON.stringify({manifest_version:manifest.manifest_version||"",updated_at:now,packs:onlinePacks}));

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

function getOrder(key,ids){const o=state.orders[key];return Array.isArray(o)&&o.length===ids.length&&o.every(x=>ids.includes(x))?o:[...ids]}
function setOrder(key,o){state.orders[key]=o;save()}

function l4HistoryKey(qid){return `${state.packId}:${state.setId}:${qid}`}
function prepareL4OptionOrders(d){
  state.l4LastPos=state.l4LastPos||{};
  const out=new Map(),used=new Set();
  for(const x of (d.questions||[])){
    const ids=(x.options||[]).map((_,i)=>i);
    let ans=Number(x.answer_index);if(!Number.isInteger(ans)||!ids.includes(ans))ans=0;
    const hk=l4HistoryKey(x.id),prev=Number.isInteger(state.l4LastPos[hk])?state.l4LastPos[hk]:null;
    let candidates=ids.filter(pos=>pos!==prev);
    const unused=candidates.filter(pos=>!used.has(pos));if(unused.length)candidates=unused;
    if(!candidates.length)candidates=[...ids];
    const target=candidates[Math.floor(Math.random()*candidates.length)];
    const distractors=shuffle(ids.filter(i=>i!==ans));
    const ord=[];let di=0;for(let pos=0;pos<ids.length;pos++)ord.push(pos===target?ans:distractors[di++]);

  }
  save();return out;
}

function provFromObject(o){const vals=Object.values(o||{}).map(String);let h="";if(vals.some(x=>x.includes("SOURCE")))h+=provBadge("SOURCE");if(vals.some(x=>x.includes("GENERATED")))h+=provBadge("GENERATED_PRACTICE");if(vals.some(x=>x.includes("DERIVED")))h+=provBadge("DERIVED_GUIDANCE");return h||provBadge("SOURCE")}

function stop(){speechToken++;try{speechSynthesis.cancel()}catch{}}
function vuri(u){return voices.find(v=>v.voiceURI===u)||voices[0]||null}
function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));if(!vs.male||!voices.some(v=>v.voiceURI===vs.male))vs.male=(voices.find(v=>/(david|mark|george|guy|ryan|eric|daniel|james|male)/i.test(v.name))||voices[0])?.voiceURI||"";if(!vs.female||!voices.some(v=>v.voiceURI===vs.female))vs.female=(voices.find(v=>/(aria|jenny|zira|samantha|hazel|susan|sonia|libby|emma|natasha|female)/i.test(v.name)&&v.voiceURI!==vs.male)||voices.find(v=>v.voiceURI!==vs.male)||voices[0])?.voiceURI||"";saveV();if(state.view==="voices")render()}
function voiceFor(role,i=0,strictGender=false){if(!voices.length)return null;if(strictGender){if(role==="M")return voices.find(v=>v.voiceURI===vs.male)||vuri(vs.male);if(role==="F")return voices.find(v=>v.voiceURI===vs.female)||vuri(vs.female);}if(vs.random)return voices[Math.floor(Math.random()*voices.length)];const extras=[vs.extra1,vs.extra2].filter(Boolean);if(role==="M")return vuri(vs.male);if(role==="F")return vuri(vs.female);return vuri(extras[i%Math.max(1,extras.length)]||vs.female||vs.male)}
function speakOne(text,voice,token){return new Promise(res=>{if(token!==speechToken){res();return}const u=new SpeechSynthesisUtterance(String(text||""));u.rate=Number(vs.rate)||.95;u.lang=voice?.lang||"en-GB";if(voice)u.voice=voice;let done=false;const keep=setInterval(()=>{if(token===speechToken&&speechSynthesis.speaking&&!speechSynthesis.paused){try{speechSynthesis.pause();setTimeout(()=>{try{speechSynthesis.resume()}catch{}},30)}catch{}}},14000);const fin=()=>{if(done)return;done=true;clearInterval(keep);res()};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})}
async function speakSegments(a,strictGender=false){stop();const t=speechToken;for(let i=0;i<a.length;i++){if(t!==speechToken)break;await speakOne(a[i].text,voiceFor(a[i].speaker,i,strictGender),t);if(t===speechToken)await new Promise(r=>setTimeout(r,120));}}
async function speakText(s,i=0){stop();const t=speechToken;await speakOne(s,voiceFor("",i),t)}

function renderL4(d){
  const ids=(d.questions||[]).map(x=>x.id),ord=getOrder(orderKey("L4"),ids),m=new Map(d.questions.map(x=>[x.id,x])),optOrders=prepareL4OptionOrders(d);

function render(){stop();$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));if(state.view==='practice')renderPractice();else if(state.view==='voices')renderVoices();else if(state.view==='packs')renderPacks();else if(state.view==='progress')renderProgress();else renderAbout()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;save();render();return}if(b.dataset.skill){state.skill=b.dataset.skill;save();renderPractice();return}if(b.dataset.lpart){state.lpart=b.dataset.lpart;save();renderPractice();return}if(b.dataset.rpart){state.rpart=b.dataset.rpart;ensureReadingUnit();save();renderPractice();return}const a=b.dataset.action;if(a==='toggle')$(`#${CSS.escape(b.dataset.target)}`)?.classList.toggle('hidden');else if(a==='shuffle')shuffleCurrent();else if(a==='original')originalCurrent();else if(a==='check-l1-item')checkL1Item(b.dataset.id);else if(a==='check-l1-all')checkL1All();else if(a==='check-l2-item')checkL2Item(b.dataset.id);else if(a==='check-l2-all')checkL2All();else if(a==='check-l3-all')checkL3All();else if(a==='check-l4-all')checkL4All();else if(a==='check-r1-item')checkR1Item(b.dataset.id);else if(a==='check-r1-all')checkR1All();else if(a==='check-r23')checkR23();else if(a==='check-r4-item')checkR4Item(b.dataset.id);else if(a==='check-r4-all')checkR4All();else if(a==='check-r5-item')checkR5Item(b.dataset.id);else if(a==='check-r5-all')checkR5All();else if(a==='show-all-keys')showAllKeys();else if(a==='r23-up')moveR23(b.dataset.id,-1);else if(a==='r23-down')moveR23(b.dataset.id,1);else if(a==='play-l1'){const x=cset().parts.L1.find(z=>z.id===b.dataset.id);await speakSegments(x.script_segments||[])}else if(a==='play-l2'){const d=cset().parts.L2,x=d.speakers.find(z=>z.id===b.dataset.id);await speakText(x.script_text,Number(b.dataset.slot||0))}else if(a==='play-l3')await speakSegments(cset().parts.L3.script_segments||[],true);else if(a==='play-l4')await speakText(cset().parts.L4.script_text,1);else if(a==='play-wrong'){const x=cset().parts.L1.find(x=>$(`[data-q="${CSS.escape(x.id)}"]`)?.classList.contains('wrong'));if(x)await speakSegments(x.script_segments||[]);else alert('Chưa có câu sai đã chấm.')}else if(a==='speak-r1'){const x=bank().R1.items.find(z=>z.id===b.dataset.id);await speakText(x.sentence_template.replace('___',x.answer))}else if(a==='speak-r4-passages'){const t=bank().R4.topics.find(x=>x.topic_id===state.runit.R4);await speakSegments(['A','B','C','D'].map((k,i)=>({speaker:i%2?'F':'M',text:`Person ${k}. ${t.passages_en[k]}`})))}else if(a==='speak-r5'){const x=bank().R5.items.find(z=>z.id===b.dataset.id);await speakText(x.practice_paragraph_en)}else if(a==='save-v'){const male=$('#male').value,female=$('#female').value;if(male&&female&&male===female){alert('Giọng Nam và Nữ phải là hai voice khác nhau để L3 đọc đúng Man/Woman.');return}vs.male=male;vs.female=female;vs.extra1=$('#extra1').value;vs.extra2=$('#extra2').value;vs.rate=Number($('#rate').value);vs.random=$('#random').value==='1';saveV();alert('Đã lưu giọng đọc. L3 luôn khóa đúng Man/Woman kể cả khi bật Random voice.')}else if(a==='reload-v')loadVoices();else if(a==='test-m'){stop();const t=speechToken;await speakOne('This is the selected male English voice for Aptis practice.',vuri($('#male').value),t)}else if(a==='test-f'){stop();const t=speechToken;await speakOne('This is the selected female English voice for Aptis practice.',vuri($('#female').value),t)}else if(a==='stop-audio')stop();else if(a==='refresh-online'){await refreshOnlinePacks(true,false)}else if(a==='use-pack'){state.packId=b.dataset.id;const p=cp();state.setId=p.sets?.[0]?.set_id||'';state.view='practice';save();render()}else if(a==='delete-pack'){const target=packs.find(x=>x.pack_id===b.dataset.id);if(target?.__pack_source!=="local"){alert('Chỉ xóa được pack cá nhân đã Import. Pack tích hợp/online được quản lý bằng manifest GitHub.');return}userPacks=userPacks.filter(x=>x.pack_id!==b.dataset.id);saveUsers();if(state.packId===b.dataset.id){state.packId=DEFAULT.pack_id;state.setId=DEFAULT.sets[0].set_id;save()}rebuildPacks();renderPacks()}else if(a==='clear-progress'){if(confirm('Xóa toàn bộ lịch sử điểm?')){state.attempts={};save();renderProgress()}}});
document.addEventListener('change',async e=>{if(e.target.id==='packSel'){state.packId=e.target.value;const p=cp();state.setId=p.sets?.[0]?.set_id||'';save();renderPractice()}else if(e.target.id==='setSel'){state.setId=e.target.value;const s=cset();if(s?.reading_refs){state.runit=Object.assign({},state.runit,s.reading_refs)}save();renderPractice()}else if(e.target.id==='runitSel'){state.runit=state.runit||{};state.runit[state.rpart]=e.target.value;save();renderPractice()}else if(e.target.id==='packFile'){const f=e.target.files?.[0];if(!f)return;try{const p=validatePack(JSON.parse(await f.text()));const protectedPack=packs.find(x=>x.pack_id===p.pack_id&&x.__pack_source!=="local");if(protectedPack)throw new Error(`pack_id ${p.pack_id} đã thuộc pack ${packSourceLabel(protectedPack)}. Hãy đổi pack_id nếu muốn giữ một bản cá nhân riêng.`);const i=userPacks.findIndex(x=>x.pack_id===p.pack_id);if(i>=0){if(!confirm(`Pack ${p.pack_id} đã được import trước đó. Ghi đè bản cá nhân?`)){e.target.value='';return}userPacks[i]=p}else userPacks.push(p);saveUsers();rebuildPacks();alert(`Đã import ${p.title||p.pack_id}. Pack cá nhân chỉ lưu trên trình duyệt này.`);renderPacks()}catch(err){alert(err.message)}finally{e.target.value=''}}});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
render();
setTimeout(()=>refreshOnlinePacks(false,true),0);
})();</script></body></html>
